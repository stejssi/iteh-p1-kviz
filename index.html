što postoje hook-ovi i zašto koristimo React<\/h3>\n<p>Ako ste radili u vanilla JavaScript-u ili jQuery-ju, znate da za promenu nečega u <strong>DOM-u (Document Object Model)<\/strong>, tj. u UI-u, morate elementu dodeliti id i pozvati <code>document.getElementById(id)<\/code>. Kada se jedna varijabla koristi na 20 mesta i zavisi od druge, svaka promena postaje sve teža, a održavanje eksponencijalno skuplje. Baš iz tih razloga <strong>Facebook je razvio React<\/strong>. React je zasnovan na <strong>Virtualnom DOM-u (VDOM)<\/strong>, koji omogućava efikasno ažuriranje korisničkog interfejsa:<\/p>\n<ol>\n<li>VDOM je <strong>kopija pravog DOM-a u memoriji<\/strong>. Kada komponenta promeni svoje stanje (state), React ne menja odmah pravi DOM.<\/li>\n<li>React prvo <strong>ažurira VDOM<\/strong> – izračunava kako bi novi VDOM izgledao nakon promene.<\/li>\n<li><strong>Upoređivanje (diffing algoritam)<\/strong> – React poredi novi VDOM sa prethodnim da bi otkrio šta se konkretno promenilo.<\/li>\n<li><strong>Minimalna promena u stvarnom DOM-u<\/strong> – na osnovu razlike React pravi minimalne izmene u pravom DOM-u, što je znatno brže nego direktno manipulisanje DOM-om.<\/li>\n<\/ol>\n<p>Zahvaljujući VDOM-u, React omogućava <strong>deklarativni pristup<\/strong>, bolje performanse i lakše održavanje aplikacija koje brzo rastu.<\/p>\n<h3>Komponente<\/h3>\n<p>Komponente nam dozvoljavaju da aplikaciju razložimo na manje delove koje možemo zasebno programirati i testirati. Smanjuju potrebu za kopiranjem istog koda na više mesta i time olakšavaju održavanje. U primeru iz skripte definisana je komponenta <strong>Card<\/strong> koja kao parametre prima naslov i boju, a zatim je iskorišćena četiri puta, kao HTML element:<\/p>\n<pre><code>interface CardProps {\n  title: string;\n  color: string;\n}\n\nconst Card = (props: CardProps) =&gt; {\n  return &lt;div className={`${props.color}`}&gt;{props.title}&lt;/div&gt;;\n};\n\n&lt;Card color={\"bg-red-500\"} title={\"Crvena\"} /&gt;\n&lt;Card color={\"bg-green-500\"} title={\"Zelena\"} /&gt;<\/code><\/pre>"}, {"id": "05-5", "t": "Tailwind", "h": "<p><strong>Tailwind je biblioteka koja nam dozvoljava da pišemo CSS stilove uz pomoć predefinisanih utility klasa<\/strong>, koje predstavljaju određeni stil ili skup stilova. Te klase kombinujemo direktno u atributu klase (class / className), kako bismo brzo realizovali dizajn bez pisanja i održavanja posebnih CSS fajlova. Ovo smanjuje vreme koje provodimo putujući između CSS koda i koda interfejsa. Tailwind je samo <strong>nadogradnja CSS-a<\/strong>.<\/p>"}, {"id": "05-6", "t": "TypeScript", "h": "<p><strong>TypeScript je programski jezik koji proširuje JavaScript dodavanjem statičke provere tipova.<\/strong><\/p>\n<p>JavaScript je <strong>dinamički<\/strong> jezik – ne znamo unapred kog su tipa promenljive, što često dovodi do grešaka koje se primete tek u vreme izvršavanja. TypeScript to rešava tako što:<\/p>\n<ul>\n<li>dodaje tipove (string, number, boolean, Date itd.),<\/li>\n<li>omogućava otkrivanje grešaka već tokom kucanja koda,<\/li>\n<li>daje pametniji autocomplete i refaktorisanje u VS Code-u.<\/li>\n<\/ul>\n<pre><code>// JavaScript\nfunction saberi(a, b) {\n  return a + b;\n}\n\n// TypeScript\nfunction saberi(a: number, b: number): number {\n  return a + b;\n}<\/code><\/pre>\n<p>U Next.js-u je TypeScript veoma važan jer ukazuje na greške pre nego što se kod deploy-uje. Na primer, ako se korisniku na backendu atribut <strong>name<\/strong> promeni u <strong>fullName<\/strong>, u JavaScript-u bi to na frontendu prošlo neprimećeno, a u TypeScript-u bi nas kompajler obavestio da u objektu korisnik više ne postoji atribut name.<\/p>\n<h3>TypeScript u kodu sa vežbi<\/h3>\n<div class='tw'><table><thead><tr><th>Konstrukcija<\/th><th>Primer<\/th><th>Značenje<\/th><\/tr><\/thead><tbody><tr><td>Tip parametra i povratne vrednosti<\/td><td><code>function saberi(a: number, b: number): number<\/code><\/td><td>Tipovi ulaza i izlaza funkcije<\/td><\/tr><tr><td>interface<\/td><td><code>interface FullSubjectDto { id: number; name: string; createdAt: Date; }<\/code><\/td><td>Tip objekta koji objedinjuje više drugih tipova<\/td><\/tr><tr><td>type<\/td><td><code>type Props = { subjects: FullSubjectDto[] }<\/code><\/td><td>Imenovan tip, npr. za props komponente<\/td><\/tr><tr><td>Niz<\/td><td><code>FullDeckDto[]<\/code><\/td><td>Niz objekata datog tipa<\/td><\/tr><tr><td>Unija<\/td><td><code>number | null<\/code><\/td><td>Vrednost je broj ili null<\/td><\/tr><tr><td>Generik<\/td><td><code>useState&lt;FullDeckDto[]&gt;(mockDecks)<\/code><\/td><td>Tip podatka u state-u<\/td><\/tr><tr><td>Tip funkcije<\/td><td><code>(value: string) =&gt; void<\/code><\/td><td>Funkcija koja prima string i ništa ne vraća<\/td><\/tr><tr><td>Opciono polje<\/td><td><code>name?: string<\/code><\/td><td>Polje ne mora da postoji<\/td><\/tr><tr><td>Optional chaining<\/td><td><code>subjects.find(...)?.name<\/code><\/td><td>Pristup polju samo ako objekat postoji<\/td><\/tr><tr><td>Non-null assertion<\/td><td><code>process.env.JWT_SECRET!<\/code><\/td><td>Vrednost sigurno nije null/undefined<\/td><\/tr><tr><td>Kastovanje<\/td><td><code>(await req.json()) as Body<\/code><\/td><td>Vrednost se tretira kao zadati tip<\/td><\/tr><tr><td>satisfies<\/td><td><code>} satisfies Config;<\/code><\/td><td>Provera da objekat odgovara tipu, bez menjanja tipa<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Interfejsi u skripti imaju sufiks <strong>Dto<\/strong>, što označava <strong>Data Transfer Object<\/strong> – objekat koji služi za prenos podataka sa backenda. Fajlovi sa TypeScript kodom imaju ekstenziju <strong>.ts<\/strong>, a fajlovi sa TypeScript-om i JSX-om (komponente) ekstenziju <strong>.tsx<\/strong>.<\/p>"}, {"id": "05-7", "t": "Next.js – načini renderovanja", "h": "<p>Next.js nadograđuje React tako što definiše kako tačno router funkcioniše i uvodi <strong>backend layer<\/strong>, zbog kog je Next.js <strong>full stack framework<\/strong>. Ovaj backend layer je baziran na <strong>ExpressJS-u<\/strong>, popularnom backend framework-u za Node. Next.js uvodi i nekoliko načina renderovanja:<\/p>\n<ul>\n<li><strong>Client-Side Rendering (CSR)<\/strong> – osnovni način renderovanja i jedini koji React kao biblioteka ima. Korisnikov pretraživač skida praznu HTML stranicu koja samo referencira JavaScript fajl, a on se nakon učitavanja pokreće i „crta“ ceo interfejs. Mana je što korisnik, dok čeka da se JavaScript dobavi i pokrene, ne vidi ništa ili vidi nešto statično (npr. loading bar).<\/li>\n<li><strong>Server-Side Rendering (SSR)<\/strong> – kada korisnik zahteva neki sadržaj, on se <strong>pre-renderuje na serveru<\/strong>, pa korisnik odmah vidi stranicu dok se ne desi <strong>hidracija<\/strong>. Hidracija je proces u kom pretraživač, kao kod CSR-a, učita JavaScript fajl i uvede interaktivnost. Mana je što u Next.js-u mora da postoji <strong>server<\/strong> koji procesuira zahteve, dok se React aplikacija može samo hostovati.<\/li>\n<li><strong>Static Site Generation (SSG)<\/strong> – jedan od glavnih razloga zašto postoji Next.js; generiše <strong>statične rute u build step-u<\/strong> i sjajan je npr. za blogove i e-commerce sajtove.<\/li>\n<li><strong>Incremental Static Regeneration (ISR)<\/strong> – stranice se inicijalno generišu u build step-u (kao kod SSG-a), ali mogu da regenerišu statički HTML „u pozadini“ po zadatom intervalu ili uslovu, bez rebuild-ovanja i redeploy-ovanja celog projekta.<\/li>\n<\/ul>"}, {"id": "05-8", "t": "Prva API ruta", "h": "<p>Backend u Next.js-u se pravi u folderu <strong>api<\/strong> unutar <code>src/app<\/code>. U skripti je napravljen folder <strong>hello<\/strong> unutar api foldera, sa fajlom <strong>route.ts<\/strong>:<\/p>\n<pre><code>export const GET = async (request: Request) =&gt; {\n  return Response.json({ message: \"Hello World!\" });\n};<\/code><\/pre>\n<p>Kada se ruta <strong>/api/hello<\/strong> pozove, dobija se JSON odgovor sa porukom „Hello World!“, kako je definisano u GET zahtevu. U projektu su potrebne osnovne HTTP metode <strong>GET, POST, PUT i DELETE<\/strong>, a podaci se sa backenda na frontend prenose u <strong>JSON<\/strong> formatu.<\/p>"}]}, {"id": "06", "t": "Next.js – frontend (poglavlje 2.1 iz Next.js skripte)", "l": [{"id": "06-1", "t": "Ideja prve stranice", "h": "<p>Ideja je da glavna stranica sa leve strane ima <strong>input za pretragu špilova<\/strong>, <strong>dugme<\/strong> kojim korisnik pravi špil i <strong>odabir predmeta<\/strong> za koje želi da vidi špilove, a sa desne strane <strong>grid špilova<\/strong> sa slikom, nazivom i predmetom za koji su pravljeni. Za fotografije se koriste placeholder slike sa sajta <strong>picsum<\/strong>.<\/p>"}, {"id": "06-2", "t": "Mock podaci", "h": "<p>Svi podaci su za sada <strong>statički<\/strong>, jer još nije uvedena baza podataka. Pošto nema backenda, potrebno je napraviti <strong>mock podatke<\/strong> – u folderu <code>src/mock<\/code> pravi se fajl <strong>data.ts<\/strong>. U njega se smeštaju podaci o predmetima i špilovima, kao i pomoćna (helper) funkcija koja pronalazi dati predmet u listi predmeta:<\/p>\n<pre><code>import { FullDeckDto, FullSubjectDto } from \"@/shared/types\";\n\nexport const mockSubjects: FullSubjectDto[] = [\n  { id: 1, name: \"Matematika 1\", createdAt: new Date(\"2024-01-10\") },\n  { id: 2, name: \"Ekonomija\", createdAt: new Date(\"2024-01-11\") },\n  // ...\n];\n\n// Helper funkcija da se pronadje predmet u listi\nconst S = (id: number) =&gt; mockSubjects.find((s) =&gt; s.id === id)!;\n\nexport const mockDecks: FullDeckDto[] = [\n  { id: 11, name: \"Funkcije i limiti – zbirka\", createdAt: new Date(\"2024-02-01\"), subject: S(1), cardsCount: 40 },\n  // ...\n];<\/code><\/pre>"}, {"id": "06-3", "t": "Deljeni tipovi", "h": "<p>U folderu <code>src/shared<\/code> pravi se fajl <strong>types.ts<\/strong>, u kom se definišu <strong>interfejsi<\/strong> koje koristi frontend. <strong>Interfejsi su tipovi objekata koji objedinjuju više drugih tipova<\/strong> (npr. interfejs Adresa sadrži ulicu, broj, stan, grad i poštanski broj, koji su primitivni tipovi). Ove tipove ćemo kasnije koristiti i na backendu, kako bismo imali iste tipove na oba mesta. Interfejsi imaju sufiks <strong>Dto (Data Transfer Object)<\/strong> – objekat koji služi za prenos podataka sa backenda.<\/p>\n<pre><code>export interface FullSubjectDto {\n  id: number;\n  name: string;\n  createdAt: Date;\n}\n\nexport interface FullDeckDto {\n  id: number;\n  name: string;\n  createdAt: Date;\n  subject: { id: number; name: string; createdAt: Date };\n  cardsCount: number;\n}<\/code><\/pre>"}, {"id": "06-4", "t": "Komponenta DeckBrowser", "h": "<p>U folderu <code>src/components<\/code> pravi se fajl <strong>DeckBrowser.tsx<\/strong>. Da bi se komponenta prikazala na početnoj stranici, u <code>src/app/page.tsx<\/code> se samo vraća ta komponenta:<\/p>\n<pre><code>import DeckBrowser from \"../components/DeckBrowser\";\n\nexport default async function Home() {\n  return &lt;DeckBrowser /&gt;\n}<\/code><\/pre>\n<h3>Tailwind klase koje se koriste<\/h3>\n<div class='tw'><table><thead><tr><th>Klasa<\/th><th>Značenje<\/th><\/tr><\/thead><tbody><tr><td><code>mx-auto<\/code><\/td><td>Horizontalni margini auto – centrira blok element horizontalno u okviru parenta<\/td><\/tr><tr><td><code>max-w-7xl<\/code><\/td><td>Maksimalna širina kontejnera; 7xl ≈ 80rem (1280px)<\/td><\/tr><tr><td><code>px-4<\/code><\/td><td>Horizontalni padding 1rem (16px) sa leve i desne strane<\/td><\/tr><tr><td><code>py-8<\/code><\/td><td>Vertikalni padding 2rem (32px) gore i dole<\/td><\/tr><tr><td><code>flex<\/code><\/td><td>Aktivira flexbox layout<\/td><\/tr><tr><td><code>flex-col<\/code><\/td><td>Elementi se slažu vertikalno (kolona)<\/td><\/tr><tr><td><code>gap-8<\/code><\/td><td>Razmak između children elemenata 2rem (32px)<\/td><\/tr><tr><td><code>md:flex-row<\/code><\/td><td>Kada ekran pređe breakpoint md (768px), elementi se slažu horizontalno<\/td><\/tr><tr><td><code>grid sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4<\/code><\/td><td>Grid sa brojem kolona koji raste sa širinom ekrana<\/td><\/tr><tr><td><code>group-hover:scale-105<\/code><\/td><td>Slika se blago uveća kada je miš iznad kartice<\/td><\/tr><tr><td><code>absolute inset-0<\/code><\/td><td>Link prekriva celu karticu, pa je cela kartica klikabilna<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>Image komponenta<\/h3>\n<p>U karticu se dodaje <strong>Image<\/strong> komponenta iz Next.js-a, koja <strong>automatski optimizuje slike<\/strong>, prikazuje pravu veličinu slike na svakom ekranu (<strong>responsive<\/strong>), koristi <strong>lazy loading po default-u<\/strong> i <strong>sprečava layout shift<\/strong> kod slika sa zadatom dimenzijom.<\/p>\n<pre><code>import Image from \"next/image\";\n\n&lt;Image src=\"https://picsum.photos/300/400\" alt=\"\" width={400} height={300}\n  className=\"h-40 w-full object-cover transition-transform duration-200 group-hover:scale-105\" /&gt;<\/code><\/pre>\n<p>Da bi Image komponenta mogla da pristupi slikama sa <strong>eksternog sajta<\/strong>, to mora eksplicitno da se naznači u konfiguracionom fajlu <strong>next.config.ts<\/strong>:<\/p>\n<pre><code>const nextConfig: NextConfig = {\n  images: {\n    remotePatterns: [\n      { protocol: \"https\", hostname: \"picsum.photos\", pathname: \"/**\" },\n    ],\n  },\n};<\/code><\/pre>\n<h3>Prikaz podataka – map i key<\/h3>\n<p>Špilovi iz mock podataka se čuvaju u state-u i prikazuju pomoću <strong>map<\/strong> metode:<\/p>\n<pre><code>\"use client\";\nimport { useEffect, useState } from \"react\";\nimport { mockDecks } from \"@/mock/data\";\nimport { FullDeckDto } from \"@/shared/types\";\n\nconst [decks, setDecks] = useState&lt;FullDeckDto[]&gt;(mockDecks);\n\n{decks.map((deck, idx) =&gt; (\n  &lt;div key={deck.id} className=\"group relative overflow-hidden rounded-lg border border-gray-200\"&gt;\n    ...\n    &lt;h3 className=\"font-semibold\"&gt;{deck.name}&lt;/h3&gt;\n  &lt;/div&gt;\n))}<\/code><\/pre>\n<p>Pošto koristimo hook-ove, odnosno <strong>client funkcionalnost<\/strong>, na vrh fajla moramo dodati <strong>\"use client\"<\/strong>.<\/p>\n<p>Metoda <strong>map<\/strong> prima callback funkciju koja se pokreće za svaki element niza i prevodi taj element u neki drugi podatak – ovde svaki element postaje jedna kartica na stranici. Da bi React mogao da razlikuje ovako dobijene elemente, prvom vraćenom elementu callback funkcije dodeljuje se jedinstveni <strong>key<\/strong> prop (ovde <code>deck.id<\/code>). Ponekad se može koristiti i indeks elementa u nizu, ako se redosled neće menjati.<\/p>\n<div class='call warn'><b>Zamka<\/b>Bez \"use client\" komponenta koja koristi useState i useEffect ne radi. Fajl page.tsx koji samo prikazuje DeckBrowser nema \"use client\".<\/div>\n<h3>Props – naziv predmeta umesto id-ja<\/h3>\n<p>Da bi se umesto id-ja predmeta prikazao njegov naziv, lista predmeta se iz <code>page.tsx<\/code> prosleđuje komponenti preko <strong>propertija (props)<\/strong>. U DeckBrowser-u se definiše tip props objekta, a naziv se pronalazi u listi:<\/p>\n<pre><code>type Props = { subjects: FullSubjectDto[] };\n\nexport default function DeckBrowser({ subjects }: Props) {\n  ...\n  {subjects.find((s) =&gt; s.id === deck.subject.id)?.name}\n}<\/code><\/pre>\n<h3>Link komponenta<\/h3>\n<p>Za dugme „+ Napravi špil“ i za otvaranje pojedinačnog špila koristi se <strong>Link<\/strong> komponenta iz Next.js-a umesto običnog anchor (a) taga. <strong>Link služi za SPA rutiranje i preload-ovanje ruta radi njihovog bržeg učitavanja.<\/strong><\/p>\n<pre><code>import Link from \"next/link\";\n\n&lt;Link href=\"/deck-create\" className=\"...\"&gt;+ Napravi špil&lt;/Link&gt;\n&lt;Link href={`/decks/${deck.id}`} className=\"absolute inset-0\" /&gt;<\/code><\/pre>\n<h3>Pretraga – controlled input<\/h3>\n<p>Za pretragu se dodaje state koji čuva vrednost unetu u input. Da bi to funkcionisalo, <strong>search state se ažurira svaki put kada se sadržaj input polja promeni<\/strong> (pri change event-u). Da se vrednost state-a ne bi razlikovala od sadržaja polja, <strong>value<\/strong> prop se postavlja na search state. Ovako definisano input polje, čiju vrednost u potpunosti kontroliše JavaScript, naziva se <strong>controlled input<\/strong>.<\/p>\n<pre><code>const [search, setSearch] = useState(\"\");\n\n&lt;input placeholder=\"Pretraga špilova…\" value={search}\n  onChange={(e) =&gt; setSearch(e.target.value)} /&gt;<\/code><\/pre>\n<p>Da bi se špilovi filtrirali po pretrazi, useEffect menja decks state u odnosu na vrednost search-a:<\/p>\n<pre><code>useEffect(() =&gt; {\n  let data = mockDecks;\n  if (search.trim())\n    data = data.filter(d =&gt; d.name.toLowerCase().includes(search.toLowerCase()));\n  setDecks(data);\n}, [search]);<\/code><\/pre>\n<p>Ako nema špilova za dati filter, prikazuje se poruka. Za to se koristi if-else izražen kroz <strong>ternarni operator<\/strong>, a deo koda se smešta unutar <strong>{ }<\/strong>, kako bi se sadržaj dinamički učitavao u JSX-u:<\/p>\n<pre><code>{decks.length === 0 ? (\n  &lt;p className=\"text-center text-gray-500\"&gt;Nema špilova za dati filter.&lt;/p&gt;\n) : (\n  &lt;div className=\"grid ...\"&gt;{decks.map(...)}&lt;/div&gt;\n)}<\/code><\/pre>"}, {"id": "06-5", "t": "Refaktorisanje komponenti", "h": "<p>Poenta React-a je da UI podelimo u <strong>male, smislene i izolovane komponente<\/strong>, da svaka komponenta ima <strong>jednu jasnu odgovornost<\/strong> i da komponente možemo <strong>ponovo koristiti (reusability)<\/strong>. Tako kod postaje čitljiviji i lakši za održavanje, testiranje i proširenje. Umesto jedne velike i nečitljive komponente, React nas podstiče da UI razbijemo na hijerarhiju komponenti koje se mogu kombinovati. Zato se DeckBrowser refaktoriše na komponente <strong>Card<\/strong>, <strong>Sidebar<\/strong> i <strong>FilterBtn<\/strong>.<\/p>\n<h3>Card<\/h3>\n<p>Kartica se izdvaja u zasebnu komponentu. Definiše se <strong>Props<\/strong> tip, a da bi kod bio čitljiviji i kraći, umesto <code>props.deck.name<\/code> radi se <strong>dekompozicija props objekta<\/strong> na sastavne delove:<\/p>\n<pre><code>type Props = {\n  deck: FullDeckDto;\n  subjects: FullSubjectDto[];\n}\n\nexport default function Card({ deck, subjects }: Props) { ... }\n\n// u DeckBrowser-u:\n{decks.map((deck, idx) =&gt; (\n  &lt;Card deck={deck} subjects={subjects} key={deck.id} /&gt;\n))}<\/code><\/pre>\n<h3>Sidebar<\/h3>\n<p>Sidebar sadrži pretragu i filtere. State ostaje u DeckBrowser-u, a Sidebar dobija i vrednost i funkciju kojom je menja, kako bi mogao da menja state roditelja (parent-a):<\/p>\n<pre><code>type Props = {\n  search: string;\n  setSearch: (value: string) =&gt; void;\n  subjectId: number | null;\n  setSubjectId: (value: number | null) =&gt; void;\n  subjects: FullSubjectDto[];\n};<\/code><\/pre>\n<p>Filtriranje je već delimično implementirano u DeckBrowser-u, a on prikazuje i kartice, pa ima smisla da se i <strong>filtriranje po predmetima realizuje upravo tamo<\/strong> – kada se pogleda stablo komponenti, to je jedini smislen način. U DeckBrowser se dodaje state <code>subjectId<\/code> (vrednost <code>null<\/code> znači „svi predmeti“), koji se prosleđuje Sidebar-u zajedno sa listom predmeta.<\/p>\n<h3>FilterBtn i children<\/h3>\n<p>Svako filter dugme je komponenta <strong>FilterBtn<\/strong>. Props su ovde definisani direktno u komponenti, bez posebnog tipa – obe varijante su ispravne. Prop <strong>active<\/strong> menja boju aktivnog dugmeta, a klik poziva <strong>handleClick<\/strong>. Tekst dugmeta se ne prosleđuje kao poseban prop – sadržaj koji se nalazi <strong>između otvarajućeg i zatvarajućeg taga<\/strong> komponente automatski se prosleđuje kroz <strong>children<\/strong>:<\/p>\n<pre><code>&lt;FilterBtn active={subjectId === null} handleClick={() =&gt; setSubjectId(null)}&gt;\n  Svi predmeti\n&lt;/FilterBtn&gt;\n{subjects.map((s) =&gt; (\n  &lt;FilterBtn key={s.id} active={subjectId === s.id} handleClick={() =&gt; setSubjectId(s.id)}&gt;\n    {s.name}\n  &lt;/FilterBtn&gt;\n))}<\/code><\/pre>\n<pre><code>export default function FilterBtn({ active, children, handleClick }: {\n  active: boolean;\n  children: React.ReactNode;\n  handleClick: () =&gt; void;\n}) {\n  return (\n    &lt;button className={`rounded border px-3 py-1 text-sm transition ${active\n      ? \"bg-indigo-50 text-indigo-700\" : \"border-gray-200 hover:bg-gray-100\"}`}\n      onClick={handleClick}&gt;\n      {children}\n    &lt;/button&gt;\n  );\n}<\/code><\/pre>\n<h3>Filtriranje po predmetu i loader<\/h3>\n<p>useEffect u DeckBrowser-u sada filtrira i po predmetu i po pretrazi, pa u dependency nizu ima obe vrednosti. Dodaje se i <strong>loader<\/strong> – trenutno nije primetan jer se koriste mock podaci, ali će biti koristan kada se podaci budu učitavali iz baze:<\/p>\n<pre><code>const [subjectId, setSubjectId] = useState&lt;number | null&gt;(null); // null = svi\nconst [loading, setLoading] = useState(false);\n\nuseEffect(() =&gt; {\n  setLoading(true);\n  let data = mockDecks;\n  if (subjectId !== null) data = data.filter(d =&gt; d.subject.id === subjectId);\n  if (search.trim())\n    data = data.filter(d =&gt; d.name.toLowerCase().includes(search.toLowerCase()));\n  setDecks(data);\n  setLoading(false);\n}, [subjectId, search]);<\/code><\/pre>"}]}, {"id": "07", "t": "Next.js – backend (poglavlja 2.2.1–2.2.8 iz Next.js skripte)", "l": [{"id": "07-1", "t": "2.2.1 Instalacija potrebnih paketa", "h": "<pre><code>npm i bcrypt drizzle-orm jsonwebtoken pg tsx @remixicon/react\nnpm i -D @types/bcrypt @types/jsonwebtoken @types/node @types/pg dotenv drizzle-kit<\/code><\/pre>\n<p>Prva komanda instalira potrebne dependency-je za <strong>produkciju<\/strong>, a druga (sa <code>-D<\/code>) instalira <strong>dev dependency-je<\/strong>, koji su potrebni samo tokom razvoja i build procesa.<\/p>\n<div class='tw'><table><thead><tr><th>Paket<\/th><th>Namena<\/th><\/tr><\/thead><tbody><tr><td><code>bcrypt<\/code><\/td><td>Heširanje (lozinki)<\/td><\/tr><tr><td><code>drizzle-orm<\/code><\/td><td>ORM – rad sa bazom na jednostavan i <strong>tipiziran<\/strong> način<\/td><\/tr><tr><td><code>pg<\/code><\/td><td>Konektor za <strong>PostgreSQL<\/strong><\/td><\/tr><tr><td><code>jsonwebtoken<\/code><\/td><td>Pravljenje i potpisivanje tokena (JWT) za autentifikaciju<\/td><\/tr><tr><td><code>tsx<\/code><\/td><td>Direktno pokretanje TypeScript fajlova bez eksplicitnog kompajliranja (koristi se za <strong>seeder<\/strong>)<\/td><\/tr><tr><td><code>@remixicon/react<\/code><\/td><td>Paket ikonica za React<\/td><\/tr><tr><td><code>@types/bcrypt<\/code>, <code>@types/jsonwebtoken<\/code>, <code>@types/node<\/code>, <code>@types/pg<\/code><\/td><td>TypeScript tipovi za te biblioteke / Node.js<\/td><\/tr><tr><td><code>dotenv<\/code><\/td><td>Učitavanje i dodatne funkcionalnosti za .env fajlove<\/td><\/tr><tr><td><code>drizzle-kit<\/code><\/td><td><strong>Migracije<\/strong> baze; podržava drizzle-orm<\/td><\/tr><\/tbody><\/table><\/div>"}, {"id": "07-2", "t": "2.2.2 Podizanje baze podataka (Postgres baza podataka u Docker-u)", "h": "<pre><code>sudo docker run --name flashcards-postgres -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=flashcards -p 5432:5432 -v flashcards_pgdata:/var/lib/postgresql/data -d postgres:17<\/code><\/pre>\n<div class='tw'><table><thead><tr><th>Deo komande<\/th><th>Značenje<\/th><\/tr><\/thead><tbody><tr><td><code>--name flashcards-postgres<\/code><\/td><td>Ime kontejnera (za kasnije upravljanje)<\/td><\/tr><tr><td><code>-e POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB<\/code><\/td><td>Env varijable za inicijalnog korisnika, lozinku i bazu (Postgres ih <strong>zahteva<\/strong>)<\/td><\/tr><tr><td><code>-p 5432:5432<\/code><\/td><td>Port; baza dostupna na <strong>localhost:5432<\/strong> (podrazumevani Postgres port)<\/td><\/tr><tr><td><code>-v flashcards_pgdata:/var/lib/postgresql/data<\/code><\/td><td><strong>Imenovani volumen<\/strong> – podaci se ne gube pri restartu kontejnera<\/td><\/tr><tr><td><code>-d<\/code><\/td><td>Pokretanje u pozadini<\/td><\/tr><tr><td><code>postgres:17<\/code><\/td><td>Slika stabilne verzije PostgreSQL 17<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Podsetnik za upravljanje kontejnerom:<\/p>\n<pre><code>docker start flashcards-postgres        # npr. posle restarta računara\ndocker stop flashcards-postgres\ndocker rm flashcards-postgres\ndocker volume rm flashcards_pgdata      # brisanje podataka<\/code><\/pre>"}, {"id": "07-3", "t": "2.2.3 Konfiguracija okruženja (.env)", "h": "<pre><code>DATABASE_URL=postgres://postgres:postgres@localhost:5432/flashcards\nAPI_URL=http://localhost:3001\nJWT_SECRET=TAJNA_LOZINKA_ZA_JWT_TOKEN\nJWT_EXPIRES=7d<\/code><\/pre>\n<p>Okruženje se konfiguriše kroz <strong>.env<\/strong> fajl u root-u projekta. <strong>.env (engl. environment) fajl služi za skladištenje osetljivih i promenljivih podataka<\/strong>, kao što su URL baze podataka (uvek u formatu <strong>postgresql://USER:PASSWORD@HOST:PORT/DATABASE<\/strong>), API ključevi, broj porta aplikacije i konfiguracije za razvoj i produkciju. Umesto da se ove vrednosti pišu direktno u kod, što nije bezbedno i predstavlja lošu praksu, čuvaju se u .env fajlu, a aplikacija ih učitava preko <strong>process.env<\/strong>.<\/p>\n<p>.env fajl je koristan iz tri razloga:<\/p>\n<ul>\n<li><strong>Bezbednost<\/strong> – .env se ne dodaje u Git repozitorijum (zbog .gitignore fajla), pa lozinke i drugi poverljivi podaci ne završavaju javno na internetu.<\/li>\n<li><strong>Fleksibilnost<\/strong> – omogućava različite vrednosti u razvoju, testiranju i produkciji bez izmene samog koda.<\/li>\n<li><strong>Preglednost<\/strong> – sve konfiguracije su centralizovane na jednom mestu.<\/li>\n<\/ul>\n<p><strong>DATABASE_URL<\/strong> služi za pristup bazi, <strong>API_URL<\/strong> je pokazivač na URL servera, <strong>JWT_SECRET<\/strong> se koristi za šifrovanje korisničkih tokena, a <strong>JWT_EXPIRES<\/strong> definiše koliko dugo token važi.<\/p>"}, {"id": "07-4", "t": "2.2.4 Model i veza sa bazom (Drizzle)", "h": "<p>U folderu <code>src/db<\/code> prave se fajl <strong>index.ts<\/strong>, u kom se definiše veza sa bazom podataka, i fajl <strong>schema.ts<\/strong>, u kom se definiše šema baze. Kod većih projekata dobra praksa je da se šema podeli na više fajlova.<\/p>\n<pre><code>// src/db/index.ts\nimport { drizzle } from 'drizzle-orm/node-postgres';\nimport { Pool } from 'pg';\nimport * as schema from './schema';\n\nconst pool = new Pool({ connectionString: process.env.DATABASE_URL });\nexport const db = drizzle(pool, { schema });<\/code><\/pre>\n<pre><code>// src/db/schema.ts\nimport { pgTable, serial, varchar, integer, timestamp, uuid } from \"drizzle-orm/pg-core\";\n\n// Korisnici\nexport const users = pgTable(\"users\", {\n  id:        uuid(\"id\").primaryKey().defaultRandom(),\n  name:      varchar(\"name\",  { length: 100 }).notNull(),\n  email:     varchar(\"email\", { length: 255 }).notNull().unique(),\n  passHash:  varchar(\"pass_hash\", { length: 255 }).notNull(),\n  createdAt: timestamp(\"created_at\").defaultNow(),\n});<\/code><\/pre>\n<p>Drizzle je <strong>ORM (Object-Relational Mapper)<\/strong>. U modelu definišemo strukturu podataka koja će se kasnije migrirati u PostgreSQL instancu – Drizzle ovaj kod konvertuje u SQL, a struktura baze se kreira u skladu sa definicijom iz šeme.<\/p>\n<p>Podrazumevano je naziv kolone u bazi isti kao naziv propertija u kodu. U primeru je naziv kolone eksplicitno definisan: <strong>passHash<\/strong> je naziv propertija u kodu, a <strong>pass_hash<\/strong> naziv kolone u bazi.<\/p>\n<p>Kao id se koristi <strong>GUID (Globally Unique Identifier), odnosno UUID<\/strong>. Ovaj tip olakšava programsko popunjavanje baze, jer vrednosti možemo unapred generisati i ne moramo da brinemo o vezivanju spoljnih ključeva sa drugim tabelama. PostgreSQL ima mehanizme za indeksiranje UUID tipa, pa je razlika u performansama u odnosu na int autoinkrementalni tip <strong>zanemarljiva<\/strong>.<\/p>\n<p>Polje <strong>createdAt<\/strong> čuva vreme kreiranja korisnika i predstavlja podatak koji je faktički autoinkrementalan u vremenskom smislu, pa se po njemu može indeksirati. Za ime, email i heširanu lozinku definisano je da ne smeju biti NULL (<strong>NOT NULL<\/strong> constraint), a email dodatno ima <strong>UNIQUE<\/strong> ograničenje. Polja su tipa <strong>varchar<\/strong> sa definisanom dužinom.<\/p>\n<pre><code>// drizzle.config.ts (root projekta)\nimport { type Config } from \"drizzle-kit\"\n\nexport default {\n  schema: \"./src/db/schema.ts\",\n  out: \"./src/db/migrations\",\n  dialect: \"postgresql\",\n  dbCredentials: {\n    url: process.env.DATABASE_URL!,\n  }\n} satisfies Config;<\/code><\/pre>\n<p>Fajl <strong>drizzle.config.ts<\/strong> u root-u projekta definiše gde se nalazi šema baze, gde će se generisati migracije (umesto podrazumevanog <code>.drizzle<\/code>, u folderu <code>src/db/migrations<\/code>), kako se vrši veza sa bazom (iz .env fajla) i tip baze koji koristimo. Tip baze, odnosno <strong>dialect<\/strong>, omogućava da koristimo Drizzle funkcije i upite prilagođene konkretnoj bazi.<\/p>\n<p>Na kraju konfiguracionog objekta dodaje se <strong>satisfies Config<\/strong>. Ovo je TypeScript mehanizam koji proverava da li dati objekat odgovara tipu Config – da li su prisutna sva obavezna polja i da li su tipovi vrednosti ispravni. Za razliku od klasičnog tipiziranja (<code>const config: Config = { ... }<\/code>), satisfies <strong>ne menja tip samog objekta<\/strong>, već samo proverava njegovu ispravnost. Tako se greške u konfiguraciji uočavaju već u fazi pisanja koda, a ne tek pri pokretanju aplikacije.<\/p>"}, {"id": "07-5", "t": "2.2.5 Migracije i seed-ovanje", "h": "<p><strong>Migracije predstavljaju inkrementalne izmene šeme baze podataka.<\/strong> Na primer, ako već imamo tabelu korisnika i želimo da dodamo novo polje (npr. broj lične karte), klasičan pristup bi bio SQL komanda ALTER TABLE. Migracije omogućavaju da ove promene definišemo unutar aplikacije i generišemo ih kao novu verziju šeme. Takođe omogućavaju povratak na neku od prethodnih verzija šeme. U zavisnosti od vrste migracije može doći do <strong>gubitka podataka<\/strong> – na primer, ako uklonimo kolonu, podaci iz nje se gube.<\/p>\n<p><strong>Seedovanje predstavlja proces popunjavanja baze podataka početnim podacima.<\/strong> Najčešće se koriste testni podaci, ali se seedovanje može primenjivati i na produkcione podatke (npr. tabela sa listom svih država).<\/p>\n<p>Korišćenjem GUID/UUID vrednosti dobija se mogućnost <strong>inkrementalnog seedovanja<\/strong> – seeder se može ponovo pokrenuti bez bojazni da će doći do dupliranja podataka, jer baza neće dozvoliti unos zapisa sa istim GUID-om.<\/p>\n<p>package.json – izmene:<\/p>\n<pre><code>{\n  \"name\": \"glavni-projekat\",\n  \"type\": \"module\",\n  \"scripts\": {\n    \"dev\": \"next dev\",\n    \"build\": \"next build\",\n    \"start\": \"next start\",\n    \"db:migrate\": \"npx drizzle-kit generate &amp;&amp; npx drizzle-kit push\",\n    \"db:seed\": \"tsx src/db/seed.ts\"\n  }\n}<\/code><\/pre>\n<p>Tip projekta se menja na <strong>module<\/strong>, jer <strong>CommonJS ne podržava top level await<\/strong>, koji je za ovaj projekat neophodan. Skripta <strong>db:migrate<\/strong> služi za kreiranje i primenu migracija baze pomoću Drizzle ORM-a, a skripta <strong>db:seed<\/strong> za pokretanje seed skripte koja popunjava bazu početnim podacima.<\/p>\n<pre><code>npm run db:migrate        # u src/db/migrations nastaje SQL skripta\nsudo docker exec -it flashcards-postgres psql -U postgres -d flashcards\n\\dt                       # lista tabela\n\\d users                  # struktura tabele users\nnpx drizzle-kit introspect   # čita tabele iz postojeće baze\nnpm run db:seed<\/code><\/pre>\n<pre><code>// src/db/seed.ts\nimport \"dotenv/config\";\nimport { users } from \"./schema\";\nimport { db } from \"./index\";\nimport bcrypt from \"bcrypt\";\n\nconst hash = await bcrypt.hash(\"1233\", 10);\n\nawait db.transaction(async (tx) =&gt; {\n  await tx.insert(users).values([\n    { id: \"7a0a1e00-9651-4071-86b8-ed32dba35bf2\", name: \"Nikola Tesla\",  email: \"tesla@gmail.com\",    passHash: hash },\n    { id: \"7a0a1e00-9651-4071-86b8-ed32dba35bf3\", name: \"Petar Petrović\", email: \"petrovic@gmail.com\", passHash: hash },\n    { id: \"7a0a1e00-9651-4071-86b8-ed32dba35bf4\", name: \"Novak Đoković\",  email: \"djokovic@gmail.com\", passHash: hash },\n  ]);\n});\n\nprocess.exit(0);<\/code><\/pre>\n<p>Fajl seed.ts služi za inicijalno i inkrementalno popunjavanje baze testnim korisnicima. Pre upisa se lozinka <strong>hešira pomoću bcrypt biblioteke<\/strong>, kako bi se simulirao realan i bezbedan način čuvanja lozinki. Podaci se upisuju unutar jedne <strong>transakcije<\/strong>, čime se obezbeđuje da se svi zapisi dodaju odjednom ili da se u slučaju greške ne doda nijedan. Koriste se unapred definisani UUID identifikatori, kako bi seed mogao da se pokreće više puta bez stvaranja duplikata. Na kraju se proces eksplicitno završava (<code>process.exit(0)<\/code>), kako bi se skripta pravilno ugasila.<\/p>"}, {"id": "07-6", "t": "2.2.6 Provera podataka", "h": "<p>Za lakše praćenje izmena u bazi koristi se VS Code ekstenzija <strong>Database Client<\/strong>, u kojoj se pravi konekcija na PostgreSQL bazu pomoću connection string-a iz .env fajla.<\/p>"}, {"id": "07-7", "t": "2.2.7 API – registracija, login, provera (JWT u cookie-ju)", "h": "<h3>src/lib/auth.ts<\/h3>\n<pre><code>import * as jwt from \"jsonwebtoken\"\n\nexport const AUTH_COOKIE = \"auth\";               // ime cookie-ja u kom je token\nconst JWT_SECRET = process.env.JWT_SECRET!;      // tajna iz .env\n\nif (!JWT_SECRET) {\n  throw new Error(\"Missing JWT_SECRET in env file\")\n}\n\nexport type JwtUserClaims = {\n  sub: string;      // subject – standardno za JWT, obično id korisnika\n  email: string;\n  name?: string;\n}\n\n// poziva se pri uspešnom login-u/registraciji\nexport function signAuthToken(claims: JwtUserClaims) {\n  return jwt.sign(claims, JWT_SECRET, { algorithm: \"HS256\", expiresIn: \"7d\" })\n}\n\nexport function verifyAuthToken(token: string): JwtUserClaims {\n  const payload = jwt.verify(token, JWT_SECRET) as jwt.JwtPayload &amp; JwtUserClaims;\n  if (!payload || !payload.sub || !payload.email) throw new Error(\"Invalid token\");\n  return { sub: payload.sub, email: payload.email, name: payload.name }\n}\n\n// opcije za COOKIE (ne za JWT)\nexport function cookieOpts() {\n  return {\n    httpOnly: true,                                   // JS ne može da pročita – zaštita od XSS\n    sameSite: \"lax\" as const,                         // normalna navigacija u okviru sajta – zaštita od CSRF\n    secure: process.env.NODE_ENV === \"production\",    // na produkciji samo preko HTTPS\n    path: \"/\",                                        // dostupan na svim rutama\n    maxAge: 60 * 60 * 24 * 7                          // 7 dana (u sekundama), ne duže od JWT-a\n  }\n}<\/code><\/pre>\n<p>U fajlu <strong>auth.ts<\/strong> (folder <code>src/lib<\/code>) definišu se funkcionalnosti za generisanje bezbednih tokena korisnicima i proveru njihove validnosti. U token se skladište <strong>id korisnika (sub), email i ime<\/strong>. Funkcija <strong>signAuthToken<\/strong> generiše token pomoću algoritma <strong>HS256<\/strong> i tajne iz .env fajla – HS256 je <strong>simetričan<\/strong> algoritam, pa se isti secret koristi i za kasniju verifikaciju. Funkcija <strong>verifyAuthToken<\/strong> prima token, verifikuje ga i izdvaja podatke iz njega. Pošto validan token ne znači da ima sva polja, proverava se da li sadrži obavezne claim-ove.<\/p>\n<div class='tw'><table><thead><tr><th>Opcija cookie-ja<\/th><th>Vrednost<\/th><th>Svrha<\/th><\/tr><\/thead><tbody><tr><td><code>httpOnly<\/code><\/td><td>true<\/td><td>Nedostupan JavaScript-u → zaštita od <strong>XSS<\/strong><\/td><\/tr><tr><td><code>sameSite<\/code><\/td><td>\"lax\"<\/td><td>Šalje se pri normalnoj navigaciji u okviru sajta → zaštita od <strong>CSRF<\/strong><\/td><\/tr><tr><td><code>secure<\/code><\/td><td>NODE_ENV === \"production\"<\/td><td>Samo preko <strong>HTTPS<\/strong> u produkciji<\/td><\/tr><tr><td><code>path<\/code><\/td><td>\"/\"<\/td><td>Važi na svim rutama<\/td><\/tr><tr><td><code>maxAge<\/code><\/td><td>60*60*24*7<\/td><td>7 dana (sekunde)<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>Struktura API ruta<\/h3>\n<div class='tw'><table><thead><tr><th>Fajl<\/th><th>Ruta<\/th><th>Metoda<\/th><th>Namena<\/th><\/tr><\/thead><tbody><tr><td><code>src/app/api/auth/register/route.ts<\/code><\/td><td>/api/auth/register<\/td><td>POST<\/td><td>Registracija<\/td><\/tr><tr><td><code>src/app/api/auth/login/route.ts<\/code><\/td><td>/api/auth/login<\/td><td>POST<\/td><td>Prijava<\/td><\/tr><tr><td><code>src/app/api/auth/me/route.ts<\/code><\/td><td>/api/auth/me<\/td><td>GET<\/td><td>Ko je ulogovan (provera tokena)<\/td><\/tr><tr><td><code>src/app/api/auth/logout/route.ts<\/code><\/td><td>/api/auth/logout<\/td><td>POST<\/td><td>Odjava (brisanje cookie-ja)<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>Login – tok (7 koraka) i kod<\/h3>\n<ol>\n<li><strong>Parse request<\/strong> – iz request-a email i password.<\/li>\n<li><strong>Validate input<\/strong> – oba polja prisutna; inače <strong>401<\/strong>.<\/li>\n<li><strong>Look up user by email<\/strong> – ako ne postoji, <strong>401<\/strong>.<\/li>\n<li><strong>Compare password<\/strong> – <code>bcrypt.compare<\/code>; pogrešna lozinka <strong>401<\/strong>.<\/li>\n<li><strong>Sign JWT<\/strong> – token sa sub (id), email i name.<\/li>\n<li><strong>Set cookie with JWT<\/strong> – secure i httpOnly opcije.<\/li>\n<li><strong>Return JSON user data<\/strong> – frontend dobija podatke o korisniku.<\/li>\n<\/ol>\n<pre><code>import { db } from \"@/db\";\nimport { usersTable } from \"@/db/schema\";\nimport { AUTH_COOKIE, cookieOpts, signAuthToken } from \"@/lib/auth\";\nimport bcrypt from \"bcrypt\";\nimport { eq } from \"drizzle-orm\";\nimport { NextResponse } from \"next/server\";\n\ntype Body = { email: string; password: string; };\n\nexport async function POST(req: Request) {\n  const { email, password } = (await req.json()) as Body;\n  if (!email || !password) {\n    return NextResponse.json({ error: \"Pogesan email ili lozinka\" }, { status: 401 });\n  }\n  const [u] = await db.select().from(usersTable).where(eq(usersTable.email, email));\n  if (!u) {\n    return NextResponse.json({ error: \"Pogesan email ili lozinka\" }, { status: 401 });\n  }\n  const ok = await bcrypt.compare(password, u.passHash);\n  if (!ok) {\n    return NextResponse.json({ error: \"Pogesan email ili lozinka\" }, { status: 401 });\n  }\n  const token = signAuthToken({ sub: u.id, email: u.email, name: u.name });\n  const res = NextResponse.json({ id: u.id, name: u.name, email: u.email });\n  res.cookies.set(AUTH_COOKIE, token, cookieOpts());\n  return res;\n}<\/code><\/pre>\n<h3>Register – tok (8 koraka) i ključni delovi<\/h3>\n<ol>\n<li>Parse request (name, email, password). 2. Validate – nedostaje podatak → <strong>400<\/strong> („Nedostaju podaci“). 3. Check if user exists – email postoji → <strong>400<\/strong> („Email postoji u bazi“). 4. <strong>Hash password<\/strong> (<code>bcrypt.hash(password, 10)<\/code>). 5. Create user (insert + returning). 6. Sign JWT. 7. Set cookie. 8. Return JSON.<\/li>\n<\/ol>\n<pre><code>const exists = await db.select().from(usersTable).where(eq(usersTable.email, email));\nif (exists.length) {\n  return NextResponse.json({ error: \"Email postoji u bazi\" }, { status: 400 });\n}\nconst passHash = await bcrypt.hash(password, 10);\nconst [u] = await db\n  .insert(usersTable)\n  .values({ name, email, passHash })\n  .returning({ id: usersTable.id, name: usersTable.name, email: usersTable.email });\nconst token = signAuthToken({ sub: u.id, email: u.email, name: u.name });\nconst res = NextResponse.json(u);\nres.cookies.set(AUTH_COOKIE, token, cookieOpts());\nreturn res;<\/code><\/pre>\n<h3>Logout<\/h3>\n<pre><code>import { AUTH_COOKIE } from \"@/lib/auth\";\nimport { NextResponse } from \"next/server\";\n\nexport async function POST() {\n  const res = NextResponse.json({ ok: true })\n  res.cookies.set(AUTH_COOKIE, \"\", {\n    httpOnly: true,\n    sameSite: \"lax\" as const,\n    secure: process.env.NODE_ENV === \"production\",\n    path: \"/\",\n    maxAge: 0,\n    expires: new Date(0)   // 01.01.1970. – browser ga sam briše\n  })\n  return res;\n}<\/code><\/pre>\n<p>Logout radi tako što se samo podešava da cookie <strong>ističe<\/strong>. cookieOpts se ne koristi, jer su opcije malo drugačije, već se kreiraju nove.<\/p>\n<h3>Me – provera prijavljenog korisnika<\/h3>\n<pre><code>// forsira Node.js runtime – biblioteke nisu kompatibilne sa Edge runtime-om\nexport const runtime = \"nodejs\";\n\nimport { NextResponse } from \"next/server\";\nimport { cookies } from \"next/headers\";\nimport { eq } from \"drizzle-orm\";\nimport { db } from \"@/db\";\nimport { users } from \"@/db/schema\";\nimport { AUTH_COOKIE, verifyAuthToken } from \"@/lib/auth\";\n\nexport async function GET() {\n  // 1. čitanje tokena iz cookie-ja\n  const token = (await cookies()).get(AUTH_COOKIE)?.value;\n  if (!token) {\n    return NextResponse.json({ user: null });   // nije ulogovan\n  }\n  try {\n    const claims = verifyAuthToken(token);      // 2. verifikacija\n    const [u] = await db\n      .select({ id: users.id, name: users.name, email: users.email, createdAt: users.createdAt })\n      .from(users)\n      .where(eq(users.id, claims.sub));         // 3. korisnik po id-ju\n    return NextResponse.json({ user: u ?? null });   // 4. podaci ili null\n  } catch {\n    // 5. nevalidan ili istekao token\n    return NextResponse.json({ user: null }, { status: 401 });\n  }\n}<\/code><\/pre>\n<h3>Drizzle i Next.js API – rečnik<\/h3>\n<div class='tw'><table><thead><tr><th>Izraz<\/th><th>Značenje<\/th><\/tr><\/thead><tbody><tr><td><code>db.select().from(tabela).where(eq(kolona, vrednost))<\/code><\/td><td>SELECT ... WHERE kolona = vrednost<\/td><\/tr><tr><td><code>db.select({ id: users.id, ... })<\/code><\/td><td>Biranje samo određenih kolona<\/td><\/tr><tr><td><code>db.insert(tabela).values({...}).returning({...})<\/code><\/td><td>INSERT ... RETURNING<\/td><\/tr><tr><td><code>db.transaction(async (tx) =&gt; {...})<\/code><\/td><td>Transakcija<\/td><\/tr><tr><td><code>eq<\/code> (iz <code>drizzle-orm<\/code>)<\/td><td>Operator jednakosti u uslovu<\/td><\/tr><tr><td><code>const [u] = await ...<\/code><\/td><td>Destrukturiranje prvog reda rezultata<\/td><\/tr><tr><td><code>await req.json()<\/code><\/td><td>Čitanje JSON tela zahteva<\/td><\/tr><tr><td><code>NextResponse.json(data, { status })<\/code><\/td><td>JSON odgovor sa statusom (iz <code>next/server<\/code>)<\/td><\/tr><tr><td><code>res.cookies.set(ime, vrednost, opcije)<\/code><\/td><td>Postavljanje cookie-ja u odgovoru<\/td><\/tr><tr><td><code>(await cookies()).get(ime)?.value<\/code><\/td><td>Čitanje cookie-ja (iz <code>next/headers<\/code>)<\/td><\/tr><tr><td><code>u ?? null<\/code><\/td><td>Nullish coalescing – ako je u undefined/null, vrati null<\/td><\/tr><\/tbody><\/table><\/div>\n<div class='tw'><table><thead><tr><th>Status<\/th><th>Gde se koristi<\/th><\/tr><\/thead><tbody><tr><td>200<\/td><td>Uspešan odgovor (podrazumevano)<\/td><\/tr><tr><td>400<\/td><td>Register: nedostaju podaci / email već postoji<\/td><\/tr><tr><td>401<\/td><td>Login: nedostaju podaci, nema korisnika, pogrešna lozinka; Me: nevalidan token<\/td><\/tr><\/tbody><\/table><\/div>"}, {"id": "07-8", "t": "2.2.8 Testiranje API-ja (Postman)", "h": "<p>API se testira korišćenjem alatke za testiranje REST servisa, na primer <strong>Postman-a<\/strong>. Komandom <code>npm run dev<\/code> startuje se server na adresi <strong>http://localhost:3000<\/strong>. Najpre se šalje zahtev na rutu <strong>/api/auth/register<\/strong> – pravi se korisnik, a token se vraća u sekciji <strong>cookies<\/strong>. Zatim se poziva <strong>/api/auth/me<\/strong>, i sa kolačićem se dobijaju podaci o korisniku. Na kraju se u bazi može proveriti da je korisnik zaista napravljen.<\/p>\n<div class='call note'><b>Napomena<\/b>Poglavlje 2.2.9 (Povezivanje sa frontend-om) NISU deo P1.<\/div>"}]}, {"id": "08", "t": "Časovi i domaći sa vežbi – objašnjenje korak po korak", "l": [{"id": "08-1", "t": "Redosled časova u jednoj rečenici", "h": "<div class='tw'><table><thead><tr><th>Čas<\/th><th>Tema<\/th><th>Šta je ishod<\/th><\/tr><\/thead><tbody><tr><td>Čas 1<\/td><td>Docker osnove<\/td><td>Slika, kontejner, volumen, mreža – i domaći koji sve to spaja<\/td><\/tr><tr><td>Čas 2<\/td><td>Git/GitHub + višekontejnerski projekat<\/td><td>Projekat sa GitHub-a koji ima backend, frontend i bazu, povezane preko compose.yaml<\/td><\/tr><tr><td>Čas 3<\/td><td>Prvi Next.js projekat<\/td><td>Kako radi rutiranje (page i layout) i prvi useState<\/td><\/tr><tr><td>Čas 4<\/td><td>Next.js prva stranica + Docker u WSL-u<\/td><td>Kartice špilova sa mock podacima, pretraga; kompletan compose primer u WSL-u<\/td><\/tr><tr><td>Čas 5<\/td><td>Refaktorisanje u komponente<\/td><td>DeckBrowser razbijen na Card, Sidebar i FilterBtn; filter po predmetu; Next.js u Docker kontejneru<\/td><\/tr><\/tbody><\/table><\/div>"}, {"id": "08-2", "t": "Čas 1 – Docker osnove i domaći zadatak 2", "h": "<h3>Šta je bila poenta časa<\/h3>\n<p>Na prvom času je cilj bio da se razume osnovni Docker tok: od aplikacije napravimo <strong>sliku<\/strong> (pomoću Dockerfile-a), iz slike pokrenemo <strong>kontejner<\/strong>, a zatim rešimo dva problema koja se odmah javljaju:<\/p>\n<ol>\n<li><strong>Podaci nestaju<\/strong> kada se kontejner obriše – rešava se <strong>volumenom<\/strong>.<\/li>\n<li><strong>Kontejneri ne vide jedni druge<\/strong> (aplikacija ne može da nađe bazu) – rešava se <strong>Docker mrežom<\/strong>.<\/li>\n<\/ol>\n<p>Sve to je opisano u Docker skripti kroz primere 1-node (slika i kontejner), 3-volumes (volumeni) i 4-network (mreže). Domaći zadatak 2 je bio jedan primer u kom student sve te korake prolazi sam, na novoj aplikaciji.<\/p>\n<h3>Aplikacija iz domaćeg: Feedback Collector<\/h3>\n<p>Dobijena je gotova mala Node.js/Express aplikacija. Korisnik u formu upiše utisak (feedback), a aplikacija:<\/p>\n<ul>\n<li><strong>uvek<\/strong> napravi .txt fajl sa tim tekstom u folderu <code>/app/feedback<\/code> unutar kontejnera;<\/li>\n<li><strong>ako je baza dostupna<\/strong>, u MySQL bazu (<code>feedback_db<\/code>, tabela <code>feedback_metadata<\/code>) upiše i podatke o fajlu (naziv, putanju, naslov, vreme);<\/li>\n<li>ako baza <strong>nije<\/strong> dostupna, aplikacija i dalje radi i samo čuva fajl – to se u README-u zove <strong>graceful fallback<\/strong>.<\/li>\n<\/ul>\n<p>Bitne činjenice iz koda aplikacije:<\/p>\n<ul>\n<li>aplikacija radi na portu <strong>3001<\/strong> unutar kontejnera;<\/li>\n<li>bazu traži na hostu <strong>mysql-db<\/strong> (to je ime koje će kontejner baze imati na Docker mreži), sa korisnikom <strong>fuser<\/strong> i bazom <strong>feedback_db<\/strong>;<\/li>\n<li>ima rute <code>/health<\/code> (da li aplikacija radi), <code>/db-status<\/code> (da li je baza dostupna) i <code>/api/feedback<\/code> (podaci iz baze u JSON formatu).<\/li>\n<\/ul>\n<h3>Šta je student radio – korak po korak<\/h3>\n<p>Svi nazivi su počinjali <strong>studentskim prefiksom<\/strong> (npr. pg20220043 – dva slova i broj indeksa), da bi automatska provera znala šta da traži.<\/p>\n<ol>\n<li><strong>Napisao Dockerfile<\/strong> za aplikaciju i napravio sliku <code>&lt;prefiks&gt;-img<\/code> (<code>docker build -t ...<\/code>). Ovo proverava razumevanje FROM, WORKDIR, COPY, RUN, EXPOSE i CMD.<\/li>\n<li><strong>Pokrenuo prvi kontejner<\/strong> <code>&lt;prefiks&gt;-cont1<\/code> tako da je aplikacija dostupna na portu <strong>3001<\/strong> – vežbanje opcije <code>-p<\/code>.<\/li>\n<li><strong>Napravio volumen<\/strong> <code>&lt;prefiks&gt;-vol<\/code> i pokrenuo <code>&lt;prefiks&gt;-cont2<\/code> na portu <strong>4000<\/strong> koji fajlove čuva u tom volumenu.<\/li>\n<li><strong>Pokrenuo treći kontejner<\/strong> <code>&lt;prefiks&gt;-cont3<\/code> na portu <strong>4001<\/strong> sa <strong>istim volumenom<\/strong>. Poenta: novi kontejner vidi fajlove koje je napravio prethodni – to je <strong>dokaz perzistencije<\/strong> imenovanog volumena.<\/li>\n<li><strong>Pokrenuo MySQL kontejner<\/strong> <code>&lt;prefiks&gt;-server<\/code> sa bazom feedback_db i korisnikom fuser (preko <code>-e<\/code> env varijabli), i u njemu napravio log fajl u <code>/tmp<\/code> kao dokaz da je baza proverena.<\/li>\n<li><strong>Napravio mrežu<\/strong> <code>&lt;prefiks&gt;-network<\/code> i u nju dodao MySQL kontejner (<code>docker network create<\/code>, <code>docker network connect<\/code>).<\/li>\n<li><strong>Napravio novu verziju slike<\/strong> <code>&lt;prefiks&gt;-img:v2<\/code> – vežbanje <strong>tagova<\/strong>.<\/li>\n<li><strong>Pokrenuo kontejner<\/strong> <code>&lt;prefiks&gt;-baza1<\/code> na portu <strong>5000<\/strong>, povezan i na volumen i na mrežu – sada aplikacija upisuje podatke i u bazu.<\/li>\n<li>Proverio da <code>http://localhost:5000/api/feedback<\/code> vraća podatke iz baze.<\/li>\n<\/ol>\n<h3>Kako se domaći proveravao<\/h3>\n<p>Uz domaći su dobijene tri skripte:<\/p>\n<ul>\n<li><strong>checkdom2.sh<\/strong> – automatski proverava svih 10 zahteva: da li slike, kontejneri, volumen i mreža postoje (<code>docker image inspect<\/code>, <code>docker container inspect<\/code>, <code>docker volume inspect<\/code>, <code>docker network inspect<\/code>), koji su portovi mapirani (<code>docker port<\/code>), da li je kontejner pokrenut i da li ruta vraća status 200;<\/li>\n<li><strong>uploaddom2res.sh<\/strong> – zaustavlja sve kontejnere i šalje rezultat provere;<\/li>\n<li><strong>cleanupdom2.sh<\/strong> – posle provere (ako postoji ZIP arhiva sa dokazima) zaustavlja i briše Docker objekte domaćeg.<\/li>\n<\/ul>\n<p>Iz ovoga je korisno zapamtiti da se postojanje bilo kog Docker objekta proverava komandom <strong>inspect<\/strong> za taj tip objekta, a mapirani portovi komandom <strong>docker port<\/strong>.<\/p>\n<h3>Kako ovo može doći na P1<\/h3>\n<ul>\n<li>„Koji kontejner dokazuje da podaci u volumenu ostaju posle brisanja kontejnera?“ – onaj koji koristi <strong>isti imenovani volumen<\/strong> (cont3).<\/li>\n<li>„Kojom komandom se postojeći kontejner dodaje u mrežu?“ – <code>docker network connect &lt;mreža&gt; &lt;kontejner&gt;<\/code>.<\/li>\n<li>„Kako aplikacija pronalazi bazu na istoj mreži?“ – po <strong>imenu kontejnera<\/strong> (mysql-db), a ne po IP adresi.<\/li>\n<li>„Šta znači <code>-p 4000:3001<\/code>?“ – port 4000 na računaru vodi na port 3001 u kontejneru.<\/li>\n<li>„Koja komanda proverava da li volumen postoji?“ – <code>docker volume inspect &lt;ime&gt;<\/code>.<\/li>\n<\/ul>"}, {"id": "08-3", "t": "Čas 2 – Git/GitHub i projekat sa više kontejnera", "h": "<h3>Šta je bila poenta časa<\/h3>\n<p>Drugi čas je spojio dve stvari: rad sa <strong>Git-om i GitHub-om<\/strong> (kloniranje projekta, komitovanje, push, .gitignore – sve iz Git skripte) i prvi susret sa <strong>Docker Compose<\/strong>-om. Projekat sa časa (repozitorijum <code>iteh26-cas02<\/code>) je aplikacija za <strong>rezervaciju računarske opreme<\/strong> i ima tri dela:<\/p>\n<div class='tw'><table><thead><tr><th>Deo<\/th><th>Tehnologija<\/th><th>Uloga<\/th><\/tr><\/thead><tbody><tr><td>frontend<\/td><td>React + <strong>Vite<\/strong><\/td><td>Forma za rezervaciju u browseru<\/td><\/tr><tr><td>backend<\/td><td>Node.js + <strong>Express<\/strong><\/td><td>API koji prima rezervacije i upisuje ih u bazu<\/td><\/tr><tr><td>database<\/td><td><strong>PostgreSQL 16<\/strong> (slika postgres:16-alpine)<\/td><td>Tabela <code>reservations<\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<h3>Kako je projekat organizovan<\/h3>\n<ul>\n<li>Svaki deo (backend, frontend) ima <strong>svoj Dockerfile<\/strong>. Oba su skoro identična: polaze od <code>node:20-slim<\/code>, kopiraju package.json, instaliraju pakete, kopiraju kod i pokreću <code>npm run dev<\/code>.<\/li>\n<li>Folder <strong>env<\/strong> sadrži tri .env fajla – po jedan za svaki servis. Tako se lozinke i podešavanja ne pišu direktno u compose.yaml.<\/li>\n<li>Folder <strong>db<\/strong> sadrži <strong>init.sql<\/strong> – SQL skriptu koja pravi tabelu <code>reservations<\/code>. Baza je izvršava sama pri prvom pokretanju, jer je fajl montiran u <code>/docker-entrypoint-initdb.d/<\/code>.<\/li>\n<li><strong>compose.yaml<\/strong> u korenu projekta opisuje sva tri servisa, tako da se cela aplikacija pokreće jednom komandom (<code>docker compose up<\/code>).<\/li>\n<li>Fajl <strong>.dockerignore<\/strong> govori Docker-u šta da ne kopira u sliku (npr. <code>node_modules<\/code>, <code>.git<\/code>, <code>.env<\/code>) – isto kao što .gitignore govori Git-u šta da ne prati.<\/li>\n<\/ul>\n<h3>Ključna ideja: kako servisi „pričaju“ međusobno<\/h3>\n<p>U <code>env/backend.env<\/code> piše <code>DB_HOST=database<\/code>. To znači da backend bazu ne traži po IP adresi, nego po <strong>imenu servisa<\/strong> iz compose.yaml (<code>database<\/code>). Compose automatski pravi zajedničku mrežu za sve servise jednog projekta, pa se oni vide po imenu.<\/p>\n<p>Sa druge strane, <code>env/frontend.env<\/code> sadrži <code>VITE_API_URL=http://localhost:5000<\/code>. Frontend se izvršava u <strong>browseru korisnika<\/strong>, a ne unutar Docker mreže, pa API mora da gađa preko <strong>porta na računaru<\/strong> (localhost:5000), a ne preko imena servisa.<\/p>\n<h3>Poređenje sa kompletnom verzijom (WSL primer sa časa 4)<\/h3>\n<p>Compose sa časa 2 je jednostavnija verzija. Kompletna verzija istog tipa projekta (WSL primer) dodaje sve ono što je objašnjeno u Compose skripti:<\/p>\n<div class='tw'><table><thead><tr><th>Element<\/th><th>Čas 2 (iteh-app)<\/th><th>WSL primer (čas 4)<\/th><\/tr><\/thead><tbody><tr><td>Naziv projekta (<code>name<\/code>)<\/td><td>da<\/td><td>da<\/td><\/tr><tr><td>Backend slika<\/td><td><code>image: iteh-backend<\/code> (gotova slika)<\/td><td><code>build<\/code> + <code>image<\/code> (gradi se iz Dockerfile-a)<\/td><\/tr><tr><td>Eksplicitna mreža<\/td><td>ne (podrazumevana)<\/td><td>da (<code>networks<\/code>, driver bridge)<\/td><\/tr><tr><td>container_name<\/td><td>ne<\/td><td>da<\/td><\/tr><tr><td>Bind mount koda + node_modules volumen<\/td><td>ne<\/td><td>da<\/td><\/tr><tr><td>healthcheck baze<\/td><td>ne<\/td><td>da (<code>pg_isready<\/code>)<\/td><\/tr><tr><td>depends_on<\/td><td>ne<\/td><td>da (service_healthy / service_started)<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>Kako ovo može doći na P1<\/h3>\n<ul>\n<li>Prepoznavanje uloge foldera: „U kom fajlu se nalaze env varijable backend-a?“ – <code>env/backend.env<\/code>, učitan preko <code>env_file<\/code>.<\/li>\n<li>„Zašto je <code>DB_HOST=database<\/code>?“ – jer se servisi u Compose mreži vide po imenu servisa.<\/li>\n<li>„Gde se montira init.sql da bi ga baza izvršila?“ – <code>/docker-entrypoint-initdb.d/<\/code>.<\/li>\n<li>„Koji fajl određuje šta se ne kopira u sliku?“ – <code>.dockerignore<\/code>.<\/li>\n<li>Git deo: kloniranje (<code>git clone<\/code>), komitovanje i push, značenje linija u .gitignore (npr. <code>**/node_modules<\/code> – node_modules na bilo kom nivou).<\/li>\n<\/ul>"}, {"id": "08-4", "t": "Čas 3 – prvi Next.js projekat", "h": "<h3>Šta je bila poenta časa<\/h3>\n<p>Cilj je bio da se napravi prvi Next.js projekat komandom <code>create-next-app<\/code> i da se na najjednostavnijem primeru vidi kako Next.js pravi stranice iz foldera (<strong>file-based routing<\/strong>) i kako radi React <strong>state<\/strong>. Projekat (<code>first-app<\/code>) je namerno mali.<\/p>\n<h3>Šta se radilo korak po korak<\/h3>\n<ol>\n<li><strong>Napravljen projekat<\/strong> i pokrenut sa <code>npm run dev<\/code> na <code>localhost:3000<\/code>.<\/li>\n<li><strong>U root layout.tsx<\/strong> su dodata dva crvena reda teksta – jedan iznad <code>{children}<\/code> („Ovo je pocetak Layout fajla“) i jedan ispod („Ovo je kraj Layout fajla“). Poenta: šta god da je stranica, layout je <strong>oko nje<\/strong>, na svakoj ruti.<\/li>\n<li><strong>U page.tsx<\/strong> (početna stranica <code>/<\/code>) napravljen je brojač: <code>useState(0)<\/code>, prikaz broja i dugme koje ga povećava. Da bi hook radio, na vrhu fajla mora <code>\"use client\"<\/code>. U kodu je ostala i zakomentarisana linija <code>//let broj = 0<\/code> – podsetnik da se obična promenljiva <strong>ne prikazuje ponovo<\/strong> kada se promeni, a state da.<\/li>\n<li><strong>Napravljen folder <code>strana2<\/code><\/strong> sa svojim <code>page.tsx<\/code> i <code>layout.tsx<\/code>. Kada se otvori <code>/strana2<\/code>, vidi se da se layout-i <strong>ugnježdavaju<\/strong>: root layout je spolja, layout strane 2 unutra, a sadržaj strane 2 u sredini.<\/li>\n<\/ol>\n<h3>Kako ovo može doći na P1<\/h3>\n<ul>\n<li>„Koji fajl treba napraviti da bi postojala ruta /strana2?“ – <code>src/app/strana2/page.tsx<\/code>.<\/li>\n<li>„Šta predstavlja <code>{children}<\/code> u layout-u?“ – stranicu (ili ugnježdeni layout) koja se prikazuje unutar njega.<\/li>\n<li>„Zašto obična promenljiva <code>let broj<\/code> ne bi radila kao brojač?“ – promena obične promenljive ne izaziva <strong>re-render<\/strong>; useState izaziva.<\/li>\n<li>„Šta mora biti na vrhu fajla koji koristi useState?“ – <code>\"use client\"<\/code>.<\/li>\n<\/ul>"}, {"id": "08-5", "t": "Čas 4 – prva prava stranica (mock podaci) i Next.js u Dockeru", "h": "<h3>Šta je bila poenta časa<\/h3>\n<p>Ovaj čas prati poglavlje 2.1 NextJS skripte: pravi se početna stranica aplikacije sa <strong>flash karticama<\/strong> – mreža (grid) špilova sa slikom, nazivom i predmetom, i polje za pretragu. Pošto još nema baze, podaci su <strong>mock<\/strong> (izmišljeni, statički u kodu).<\/p>\n<p>Na času su korišćena tri pomoćna materijala:<\/p>\n<ul>\n<li><strong>kostur projekta<\/strong> (<code>iteh26-tamara-cas04-kostur<\/code>) – prazan Next.js projekat koji već ima <code>src/mock/data.ts<\/code> (mock predmeti i špilovi) i <code>src/shared/types.ts<\/code> (tipovi <code>FullSubjectDto<\/code> i <code>FullDeckDto<\/code>), plus Dockerfile i compose.yaml za pokretanje u kontejneru;<\/li>\n<li><strong>Mock podaci<\/strong> (zip) – fajlovi data.ts, types.ts i deo koda za sidebar, da ne bi morali da se kucaju;<\/li>\n<li><strong>gotov kod sa časa<\/strong> (<code>iteh26-cas04-master<\/code>) – stanje projekta na kraju časa.<\/li>\n<\/ul>\n<h3>Šta se radilo korak po korak<\/h3>\n<ol>\n<li>Napravljena je komponenta <strong>DeckBrowser<\/strong> i prikazana na početnoj stranici (<code>page.tsx<\/code> samo vraća <code>&lt;DeckBrowser /&gt;<\/code>).<\/li>\n<li>U DeckBrowser je dodata jedna kartica sa <strong>Image<\/strong> komponentom iz Next.js-a i slikom sa sajta picsum.photos. Da bi slika sa spoljnog sajta radila, u <strong>next.config.ts<\/strong> je dodat taj sajt pod <code>images.remotePatterns<\/code>.<\/li>\n<li>Umesto jedne kartice, špilovi iz mock podataka su prikazani pomoću <strong>map<\/strong> – za svaki špil po jedna kartica, sa <code>key={deck.id}<\/code>.<\/li>\n<li>Dodato je polje za <strong>pretragu<\/strong>: state <code>search<\/code>, input sa <code>value<\/code> i <code>onChange<\/code> (controlled input), i <strong>useEffect<\/strong> koji filtrira špilove po nazivu kad god se <code>search<\/code> promeni.<\/li>\n<li>Ako nema rezultata, prikazuje se poruka „Nema takvih spilova“ (ternarni operator u JSX-u).<\/li>\n<\/ol>\n<h3>Next.js u Dockeru – dve varijante sa časova<\/h3>\n<p>Kostur projekta ima <strong>razvojnu<\/strong> Docker varijantu – kontejner u kom se kod menja uživo:<\/p>\n<ul>\n<li>slika se pravi iz <code>node:22-alpine<\/code>, instalira pakete sa <code>npm ci<\/code> i pokreće <code>npm run dev<\/code>;<\/li>\n<li>kod se <strong>ne kopira<\/strong> u sliku – ubacuje se preko bind mount-a <code>.:/app<\/code>, pa se izmene vide odmah;<\/li>\n<li><code>/app/node_modules<\/code> i <code>/app/.next<\/code> su anonimni volumeni da ih bind mount ne pregazi;<\/li>\n<li><code>--hostname 0.0.0.0<\/code> omogućava da se Next.js server vidi i van kontejnera.<\/li>\n<\/ul>\n<p>Gotov kod sa časova 4 i 5 ima <strong>produkcionu<\/strong> varijantu:<\/p>\n<ul>\n<li>slika iz <code>node:20-alpine<\/code> kopira sav kod, pokreće <code>npm run build<\/code> <strong>pri pravljenju slike<\/strong>, a kontejner pokreće <code>npm start<\/code>;<\/li>\n<li>izmene koda zahtevaju ponovni build slike;<\/li>\n<li>compose.yaml sa časa 5 ima jedan servis <code>frontend<\/code> sa portovima <code>\"3002:3000\"<\/code> – aplikacija je na <strong>localhost:3002<\/strong>.<\/li>\n<\/ul>\n<div class='tw'><table><thead><tr><th><\/th><th>Razvojna (kostur)<\/th><th>Produkciona (čas 4/5)<\/th><\/tr><\/thead><tbody><tr><td>Kod u slici<\/td><td>ne – bind mount<\/td><td>da – COPY . .<\/td><\/tr><tr><td>Build aplikacije<\/td><td>ne<\/td><td>RUN npm run build<\/td><\/tr><tr><td>Pokretanje<\/td><td>npm run dev<\/td><td>npm start<\/td><\/tr><tr><td>Izmene se vide odmah<\/td><td>da<\/td><td>ne<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>WSL primer (Concept Match) i zadatak G4<\/h3>\n<p>U istom folderu je i <strong>iteh-wsl-primer<\/strong> – projekat koji se pokreće u Ubuntu-u preko WSL-a (vidi poglavlje o Linux okruženju). Po strukturi je isti kao projekat sa časa 2 (frontend React/Vite, backend Express, baza PostgreSQL), samo što je u pitanju igra „Concept Match“, a rezultati igre se čuvaju u tabeli <code>game_results<\/code> baze <code>games<\/code>. Njegov compose.yaml je <strong>kompletan primer<\/strong> svega iz Compose skripte:<\/p>\n<ul>\n<li>baza ima <strong>healthcheck<\/strong> sa <code>pg_isready<\/code> (interval 10s, timeout 10s, retries 6) i nema objavljen port – dostupna je samo unutar mreže;<\/li>\n<li>backend se gradi iz Dockerfile-a, dostupan je na <code>localhost:4000<\/code> (port 3000 u kontejneru) i čeka da baza bude <strong>service_healthy<\/strong>;<\/li>\n<li>frontend je na <code>localhost:5000<\/code> (port 8080 u kontejneru) i čeka da se backend <strong>pokrene<\/strong>;<\/li>\n<li>svi servisi su u eksplicitnoj mreži sa <strong>driver: bridge<\/strong>, kod je povezan bind mount-om, a podaci baze su u imenovanom volumenu.<\/li>\n<\/ul>\n<p>Uz projekat je dobijena skripta <strong>checkit-g4.sh<\/strong> – zadatak (G4) u kom je student trebalo da sam napiše backend Dockerfile, napravi sliku, pokrene testni kontejner (port 3001 → 3000, ruta <code>/health<\/code>), napiše compose.yaml sa tačnim nazivima, portovima, mrežom, volumenima i healthcheck-om, pokrene aplikaciju i odigra igru tako da se rezultat upiše u bazu. Skripta boduje svaku od tih stavki – zato je dobar podsetnik šta se smatra „ispravnim“ compose fajlom.<\/p>\n<h3>Kako ovo može doći na P1<\/h3>\n<ul>\n<li>„Šta treba dodati u next.config.ts da bi Image prikazala sliku sa picsum.photos?“ – <code>images.remotePatterns<\/code>.<\/li>\n<li>„Šta je obavezno dodati elementu u map?“ – <code>key<\/code>.<\/li>\n<li>„Kako se zove input čiju vrednost kontroliše state?“ – controlled input.<\/li>\n<li>„Koji uslov u depends_on čeka da baza prođe healthcheck?“ – <code>service_healthy<\/code>.<\/li>\n<li>„Na kojoj adresi je frontend ako je <code>ports: - \"5000:8080\"<\/code>?“ – localhost:5000.<\/li>\n<li>„Zašto razvojni Next.js kontejner ima volumen <code>/app/node_modules<\/code>?“ – da bind mount <code>.:/app<\/code> ne pregazi instalirane module.<\/li>\n<\/ul>"}, {"id": "08-6", "t": "Čas 5 – refaktorisanje u komponente i filter po predmetu", "h": "<h3>Šta je bila poenta časa<\/h3>\n<p>Na kraju časa 4 sva logika i sav izgled bili su u jednoj velikoj komponenti DeckBrowser. Čas 5 prati deo „Refaktorisanje komponenti“ iz skripte: velika komponenta se <strong>razbija na manje<\/strong>, od kojih svaka ima <strong>jednu odgovornost<\/strong>, i dodaje se <strong>filtriranje po predmetu<\/strong>.<\/p>\n<h3>Šta se radilo korak po korak<\/h3>\n<ol>\n<li><strong>Card<\/strong> – izdvojena je jedna kartica špila. Prima ceo špil kroz props (<code>deck<\/code>) i prikazuje sliku, naziv i naziv predmeta.<\/li>\n<li><strong>Sidebar<\/strong> – izdvojeni su pretraga i dugmići za filter. Sidebar <strong>nema svoj state<\/strong> – dobija vrednost pretrage i funkciju za njenu promenu od DeckBrowser-a kroz props.<\/li>\n<li><strong>FilterBtn<\/strong> – jedno dugme filtera. Tekst dugmeta se ne šalje kao prop, nego se piše između tagova (<code>&lt;FilterBtn&gt;Svi predmeti&lt;/FilterBtn&gt;<\/code>) i u komponenti stiže kao <strong>children<\/strong>.<\/li>\n<li>U DeckBrowser je dodat state <strong>subjectId<\/strong> tipa <code>number | null<\/code>, gde <code>null<\/code> znači „svi predmeti“. Sidebar pravi jedno dugme „Svi predmeti“ i po jedno dugme za svaki predmet (preko map).<\/li>\n<li>useEffect sada filtrira i po predmetu i po pretrazi, pa u dependency nizu ima oba: <code>[search, subjectId]<\/code>.<\/li>\n<\/ol>\n<h3>Zašto je state ostao u DeckBrowser-u<\/h3>\n<p>Kartice koje se prikazuju zavise i od pretrage i od izabranog predmeta. Pošto DeckBrowser crta kartice, on mora da zna obe vrednosti – zato su state i logika filtriranja kod njega, a Sidebar i FilterBtn samo javljaju promenu pozivajući funkcije koje su dobili kroz props.<\/p>\n<div class='call note'><b>Napomena<\/b>U kodu sa časa 5 imena props-a su malo drugačija nego u skripti (npr. Sidebar prima <code>onSearch<\/code>, a FilterBtn prima <code>sid<\/code> i <code>setSubjectId<\/code>). Princip je isti – bitno je da se ime propa koji se šalje poklapa sa imenom koje komponenta prima.<\/div>\n<h3>Kako ovo može doći na P1<\/h3>\n<ul>\n<li>„Kako se zove sadržaj između otvarajućeg i zatvarajućeg taga komponente?“ – <code>children<\/code>.<\/li>\n<li>„Kog tipa je subjectId i šta znači null?“ – <code>number | null<\/code>; null = svi predmeti.<\/li>\n<li>„Kako izgleda tip propa za funkciju koja prima string i ništa ne vraća?“ – <code>(value: string) =&gt; void<\/code>.<\/li>\n<li>„Šta treba upisati u dependency niz da bi se filtriralo i po pretrazi i po predmetu?“ – <code>[search, subjectId]<\/code>.<\/li>\n<li>„Šta znači <code>function Card({ deck }: Props)<\/code>?“ – destrukturiranje (dekompozicija) props objekta.<\/li>\n<\/ul>"}]}], "cheat": {"t": "Cheat sheet – tabele komandi", "h": "<h2>Git<\/h2><div class='tw'><table><thead><tr><th>Komanda<\/th><th>Namena<\/th><\/tr><\/thead><tbody><tr><td><code>git --version<\/code><\/td><td>Verzija Gita<\/td><\/tr><tr><td><code>git config --global user.name \"Ime\"<\/code><\/td><td>Globalno ime<\/td><\/tr><tr><td><code>git config --global user.email mail<\/code><\/td><td>Globalni email<\/td><\/tr><tr><td><code>git config --local user.name \"Ime\"<\/code><\/td><td>Ime samo za repozitorijum<\/td><\/tr><tr><td><code>git init<\/code><\/td><td>Novi repozitorijum<\/td><\/tr><tr><td><code>git status<\/code><\/td><td>Stanje fajlova<\/td><\/tr><tr><td><code>git add &lt;fajl&gt;<\/code> / <code>git add *<\/code> / <code>git add .<\/code><\/td><td>Stejdžovanje<\/td><\/tr><tr><td><code>git commit -m \"poruka\"<\/code><\/td><td>Komit<\/td><\/tr><tr><td><code>git commit -a -m \"poruka\"<\/code><\/td><td>Stejdž praćenih + komit<\/td><\/tr><tr><td><code>git commit --amend<\/code><\/td><td>Izmena poslednjeg komita<\/td><\/tr><tr><td><code>git reset HEAD &lt;fajl&gt;<\/code> / <code>git restore --staged &lt;fajl&gt;<\/code><\/td><td>Skidanje sa stejdža<\/td><\/tr><tr><td><code>git checkout -- &lt;fajl&gt;<\/code> / <code>git restore &lt;fajl&gt;<\/code><\/td><td>Odbacivanje izmena (opasno)<\/td><\/tr><tr><td><code>git log<\/code> / <code>git log --pretty --graph<\/code><\/td><td>Istorija (izlaz: q)<\/td><\/tr><tr><td><code>git log --oneline --decorate --graph --all<\/code><\/td><td>Grane kao graf<\/td><\/tr><tr><td><code>git checkout &lt;heš&gt;<\/code><\/td><td>Prelazak
