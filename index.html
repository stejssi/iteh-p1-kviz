<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ITEH P1 – učenje i kviz</title>
<style>
:root{
  --bg:#f6f4ef; --panel:#ffffff; --ink:#1d2433; --muted:#5f6b7a; --line:#e3e0d8;
  --accent:#1f4e79; --accent-soft:#e7eef6; --ok:#2f7d4a; --ok-soft:#e6f3ea; --bad:#b4372f; --bad-soft:#fbe9e7;
  --warn:#b4372f; --note:#2e75b6; --code-bg:#f1efe9; --shadow:0 1px 2px rgba(20,30,50,.06),0 4px 16px rgba(20,30,50,.05);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#14171d; --panel:#1c2028; --ink:#e6e8ec; --muted:#9aa3b2; --line:#2c323d;
    --accent:#7fb2e5; --accent-soft:#1f2b3a; --ok:#6cc58b; --ok-soft:#1b2c22; --bad:#ef7d72; --bad-soft:#331e1d;
    --warn:#ef7d72; --note:#7fb2e5; --code-bg:#232833; --shadow:none; }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif}
code,pre{font-family:"Cascadia Code",Consolas,"SFMono-Regular",Menlo,monospace}
header{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:18px;padding:10px 22px}
.brand{font-weight:700;letter-spacing:.2px;white-space:nowrap}
.brand span{color:var(--accent)}
nav.tabs{display:flex;gap:4px}
nav.tabs button{white-space:nowrap;border:0;background:none;color:var(--muted);font:inherit;font-weight:600;padding:8px 14px;border-radius:8px;cursor:pointer}
nav.tabs button.on{background:var(--accent-soft);color:var(--accent)}
.prog{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);white-space:nowrap}
.bar{width:140px;height:6px;background:var(--line);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
#menuBtn{display:none;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:6px 10px;font:inherit;cursor:pointer}
main{display:flex;min-height:calc(100vh - 57px)}
aside{width:310px;flex:none;border-right:1px solid var(--line);background:var(--panel);padding:14px 10px 40px;overflow:auto;position:sticky;top:57px;height:calc(100vh - 57px)}
aside h4{margin:16px 10px 6px;font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
aside a{display:flex;gap:8px;align-items:flex-start;padding:6px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:14px;line-height:1.35;cursor:pointer}
aside a:hover{background:var(--accent-soft)}
aside a.on{background:var(--accent);color:#fff}
aside a .dot{flex:none;width:16px;height:16px;margin-top:1px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:10px}
aside a .dot.done{background:var(--ok);border-color:var(--ok);color:#fff}
aside a.on .dot{border-color:#fff}
section.view{flex:1;min-width:0;padding:30px 40px 80px}
.wrap{max-width:860px;margin:0 auto}
.crumb{font-size:13px;color:var(--muted);margin-bottom:4px}
h1{font-size:30px;line-height:1.25;margin:0 0 18px;color:var(--accent)}
.lesson h3{font-size:18px;margin:26px 0 8px}
.lesson p{margin:0 0 12px}
.lesson ul,.lesson ol{margin:0 0 14px;padding-left:24px}
.lesson li{margin:3px 0}
.lesson li.sub{margin-left:22px;list-style:circle}
.lesson code{background:var(--code-bg);padding:1px 5px;border-radius:5px;font-size:.88em;color:#8b1e3f}
@media (prefers-color-scheme: dark){.lesson code{color:#f0a5b9}}
.lesson pre{background:var(--code-bg);border:1px solid var(--line);border-left:4px solid var(--muted);border-radius:8px;padding:12px 14px;overflow:auto;font-size:13.5px;line-height:1.5;margin:6px 0 16px}
.lesson pre code{background:none;padding:0;color:var(--ink);font-size:inherit}
.tw{overflow:auto;margin:6px 0 16px;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:14px}
th{background:var(--accent);color:#fff;text-align:left;padding:8px 10px;font-weight:600}
td{padding:7px 10px;border-top:1px solid var(--line);vertical-align:top}
tr:nth-child(even) td{background:var(--accent-soft)}
th code{color:#fff;background:rgba(255,255,255,.15)}
.call{border-left:4px solid;border-radius:8px;padding:10px 14px;margin:10px 0 16px}
.call b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.6px;margin-bottom:2px}
.call.warn{border-color:var(--warn);background:var(--bad-soft)} .call.warn b{color:var(--warn)}
.call.note{border-color:var(--note);background:var(--accent-soft)} .call.note b{color:var(--note)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:22px 24px;margin:26px 0}
.card h2{margin:0 0 4px;font-size:20px}
.card .sub{color:var(--muted);font-size:14px;margin-bottom:14px}
.q{border-top:1px solid var(--line);padding:16px 0}
.q:first-of-type{border-top:0}
.qt{font-weight:600;margin-bottom:10px}
.qt .n{color:var(--accent);margin-right:6px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit;font-size:15px;cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .k{flex:none;width:22px;height:22px;border-radius:6px;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:700;display:grid;place-items:center;margin-top:1px}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.fillrow{display:flex;gap:8px}
.fillrow input{flex:1;min-width:0;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit;font-family:"Cascadia Code",Consolas,monospace;font-size:15px}
.fillrow input:focus{outline:none;border-color:var(--accent)}
.fillrow input.right{border-color:var(--ok);background:var(--ok-soft)}
.fillrow input.wrong{border-color:var(--bad);background:var(--bad-soft)}
.btn{border:0;background:var(--accent);color:#fff;font:inherit;font-weight:600;border-radius:10px;padding:10px 18px;cursor:pointer}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.btn.small{padding:6px 12px;font-size:14px}
.fb{margin-top:10px;border-radius:10px;padding:10px 12px;font-size:14.5px}
.fb.ok{background:var(--ok-soft);color:var(--ink);border-left:4px solid var(--ok)}
.fb.no{background:var(--bad-soft);color:var(--ink);border-left:4px solid var(--bad)}
.fb b{display:block;margin-bottom:2px}
.fb.ok b{color:var(--ok)} .fb.no b{color:var(--bad)}
.navrow{display:flex;justify-content:space-between;gap:10px;margin-top:22px;flex-wrap:wrap}
.score{font-size:15px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 18px}
.chip{border:1.5px solid var(--line);background:var(--panel);color:var(--ink);border-radius:99px;padding:6px 14px;font:inherit;font-size:14px;cursor:pointer}
.chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.lbl{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:600;margin-top:14px}
.big{font-size:44px;font-weight:800;color:var(--accent);line-height:1}
.qhead{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin-bottom:8px}
.tag{display:inline-block;font-size:12px;background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:1px 8px;margin-left:6px}
.qprog{height:4px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:16px}
.qprog i{display:block;height:100%;background:var(--accent)}
.review .q{padding:12px 0}
.muted{color:var(--muted)}
.cheat h2{font-size:20px;margin:28px 0 8px;color:var(--accent)}
kbd{font-family:inherit;font-size:12px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px}
@media (max-width:900px){
  #menuBtn{display:block}
  aside{position:fixed;left:0;top:57px;z-index:15;transform:translateX(-100%);transition:transform .2s;box-shadow:var(--shadow)}
  aside.open{transform:none}
  section.view{padding:20px 16px 70px}
  .prog{display:none}
  header{gap:10px;padding:10px 12px}
  .brand{font-size:14px}
  nav.tabs button{padding:6px 8px;font-size:14px}
}
</style>
</head>

<header>
  <button id="menuBtn" aria-label="Meni">☰</button>
  <div class="brand">ITEH <span>P1</span></div>
  <nav class="tabs">

  </nav>

</header>
<main>
  <aside id="side"></aside>
  <section class="view"><div class="wrap" id="view"></div></section>
</main>
<script>
const DATA = {"chapters": [{"id": "00", "t": "Uvod: šta je P1 i kako koristiti skriptu", "l": [{"id": "00-1", "t": "P1 – Test sa vežbi (iz kartona predmeta)", "h": "<div class='tw'><table><thead><tr><th>Stavka<\/th><th>Vrednost<\/th><\/tr><\/thead><tbody><tr><td>Naziv<\/td><td>P1 – Test sa vežbi<\/td><\/tr><tr><td>Broj poena<\/td><td>25 (od ukupno 115 mogućih, uključujući 15 bonus)<\/td><\/tr><tr><td>Šta se proverava<\/td><td>Individualna provera razumevanja osnovnih koncepata razvoja veb aplikacija: Git, Docker, osnove Next.js-a, TypeScript<\/td><\/tr><tr><td>Način polaganja<\/td><td>Moodle test na ELAB Moodle platformi (zaokruživanje, dopisivanje reči ili koda)<\/td><\/tr><tr><td>Kada i gde<\/td><td>Prva kolokvijumska nedelja, računarske sale Fakulteta<\/td><\/tr><tr><td>Minimum<\/td><td>Ne postoji minimum<\/td><\/tr><tr><td>Nadoknada<\/td><td>Moguća u svakom ispitnom roku; računa se najbolji ostvareni rezultat<\/td><\/tr><tr><td>Van termina<\/td><td>Test nije moguće polagati van definisanih termina<\/td><\/tr><tr><td>Gradivo<\/td><td>Gradivo pokriveno na vežbama i postavljeni materijali za samostalno vežbanje<\/td><\/tr><tr><td>Rad<\/td><td>Individualno<\/td><\/tr><\/tbody><\/table><\/div>"}, {"id": "00-2", "t": "Obim gradiva za P1", "h": "<ul>\n<li><strong>Git i GitHub<\/strong> – koncepti, komande, udaljeni repozitorijumi, konflikti, .gitignore, istorija, grane, SSH, Markdown, Pull Request, GitHub Pages.<\/li>\n<li><strong>Docker<\/strong> – slike, Dockerfile, kontejneri, Docker Hub, volumeni, mreže.<\/li>\n<li><strong>Docker Compose<\/strong> – compose.yaml, servisi, volumeni, mreže, healthcheck, komande.<\/li>\n<li><strong>Linux okruženje (WSL 2)<\/strong> – osnovni pojmovi i komande za rad sa Dockerom u Linux okruženju na Windows-u.<\/li>\n<li><strong>Next.js<\/strong> – NextJS skripta <strong>samo do poglavlja 2.2.8 (Testiranje API-ja)<\/strong>.<\/li>\n<li><strong>TypeScript<\/strong> – u meri u kojoj se koristi u Next.js skripti i kodovima sa vežbi.<\/li>\n<\/ul>\n<div class='call note'><b>Napomena<\/b>Teorija sa predavanja (referentni modeli, SOA, HTTP/MCP, veb okviri, procesi) NIJE deo P1. Fokus je isključivo na praktičnom gradivu sa vežbi.<\/div>"}, {"id": "00-3", "t": "Kako je skripta organizovana", "h": "<ul>\n<li>Okviri <strong>ZAMKA<\/strong> označavaju mesta gde se lako pogreši.<\/li>\n<li>Okviri <strong>NAPOMENA<\/strong> ističu činjenice koje se često pitaju.<\/li>\n<li>Na kraju se nalaze objašnjenje časova i domaćih sa vežbi i tabele komandi (cheat sheet).<\/li>\n<\/ul>"}]}, {"id": "01", "t": "Git i GitHub", "l": [{"id": "01-1", "t": "Kratka istorija Gita", "h": "<p>Linuks jezgro je prilično širok softverski projekat otvorenog koda. Tokom većine vremena njegovog održavanja (1991–2002) promene u softveru slate su kao zakrpe i arhivirani fajlovi. Godine <strong>2002.<\/strong> projekat Linuks jezgra počeo je da koristi vlasnički DVCS koji se zvao <strong>BitKeeper<\/strong>.<\/p>\n<p>Godine <strong>2005.<\/strong> odnos između zajednice koja je radila na Linuks jezgru i komercijalne kompanije koja je razvijala BitKeeper se raspao, i besplatan status alata bio je ukinut. To je primoralo Linuksovu zajednicu programera, a posebno <strong>Linusa Torvaldsa<\/strong>, osnivača Linuksa, da osmisle sopstveni alat – <strong>Git<\/strong>.<\/p>\n<p>Ciljevi novog sistema bili su:<\/p>\n<ul>\n<li>brzina,<\/li>\n<li>jednostavan dizajn,<\/li>\n<li>snažna podrška za nelinearni razvoj (hiljade paralelnih grana),<\/li>\n<li>potpuna distribucija,<\/li>\n<li>mogućnost da efikasno rukuje velikim projektima kao što je Linuks jezgro (brzina i veličina podataka).<\/li>\n<\/ul>\n<p>Od nastanka 2005. godine Git je evoluirao u alat koji je jednostavan za upotrebu, a zadržao je ove kvalitete: neverovatno je brz, veoma efikasan sa velikim projektima i ima odličan sistem grananja za nelinearni razvoj.<\/p>"}, {"id": "01-2", "t": "Bitni Git koncepti", "h": "<h3>Tri stanja<\/h3>\n<p>Git ima tri glavna stanja u kojima se vaši fajlovi mogu naći: <strong>komitovano<\/strong>, <strong>modifikovano<\/strong> i <strong>stejdžovano<\/strong>.<\/p>\n<ul>\n<li><strong>Komitovano<\/strong> znači da su podaci bezbedno smešteni u lokalnoj bazi podataka.<\/li>\n<li><strong>Modifikovano<\/strong> znači da ste promenili fajl, ali ga još uvek niste komitovali u bazu podataka.<\/li>\n<li><strong>Stejdžovano<\/strong> znači da ste označili modifikovani fajl da se u svom trenutnom stanju uključi u sledeći komit.<\/li>\n<\/ul>\n<h3>Tri sekcije Git projekta<\/h3>\n<p>Ovo nas vodi do tri glavne sekcije Git projekta: <strong>Git direktorijum<\/strong>, <strong>radni direktorijum<\/strong> i <strong>stejdž<\/strong>.<\/p>\n<p><strong>Git direktorijum<\/strong> je mesto gde Git čuva sve metapodatke i objektnu bazu podataka za projekat. Ovo je najvažniji deo Gita i to je ono što se kopira kada klonirate repozitorijum sa drugog računara.<\/p>\n<p><strong>Radni direktorijum<\/strong> je jedan čekaut (checkout) jedne verzije projekta. Ovi fajlovi se izvlače iz kompresovane baze podataka u Git direktorijumu i smeštaju na disk da biste ih koristili i menjali.<\/p>\n<p><strong>Stejdž<\/strong> je fajl koji se obično nalazi u Git direktorijumu i čuva informacije o tome šta će ući u sledeći komit. Ponekad se naziva i <strong>„indeks“<\/strong>.<\/p>\n<h3>Osnovni tok rada<\/h3>\n<ol>\n<li>Modifikujete fajlove u radnom direktorijumu.<\/li>\n<li>Stejdžujete fajlove, odnosno dodajete njihove snimke na stejdž.<\/li>\n<li>Komitujete – uzimate fajlove u verziji u kojoj su bili kada ste ih dodali na stejdž i te snimke trajno smeštate u Git direktorijum.<\/li>\n<\/ol>\n<p>Ako se neka verzija fajla nalazi u Git direktorijumu, smatra se komitovanom. Ako je modifikovana i dodata na stejdž, ona je stejdžovana. A ako se promenila od čekauta, ali nije stejdžovana, onda je modifikovana.<\/p>\n<p><strong>Udaljeni server<\/strong> je hostovani Git direktorijum – na primer GitHub, GitLab ili BitBucket. U skripti se koristi najpoznatiji hosting za Git, <strong>GitHub<\/strong>.<\/p>\n<h3>Praćeni i nepraćeni fajlovi<\/h3>\n<p>Svaki fajl u radnom direktorijumu može biti u jednom od dva stanja: <strong>praćen<\/strong> ili <strong>nepraćen<\/strong> (tracked ili untracked). Praćeni fajlovi su oni koji su bili u poslednjem snimku – oni mogu biti nemodifikovani, modifikovani ili stejdžovani. Nepraćeni fajlovi su svi ostali fajlovi u radnom direktorijumu koji nisu bili u poslednjem snimku i nisu na stejdžu. Kada prvi put klonirate repozitorijum, svi fajlovi su praćeni i nemodifikovani, jer ste ih upravo čekautovali i još ništa niste promenili.<\/p>"}, {"id": "01-3", "t": "Konfiguracija", "h": "<p>Pre rada sa Gitom potrebno je podesiti identitet, jer se ime i email upisuju u svaki komit:<\/p>\n<pre><code>$ git config --global user.name \"Petar Petrovic\"\n$ git config --global user.email petarpetrovic@primer.com<\/code><\/pre>\n<p>Opcija <code>--global<\/code> važi za sve repozitorijume na računaru, dok <code>--local<\/code> važi samo za trenutni repozitorijum (koristi se u delu sa SSH ključem). Instalacija se proverava komandom <code>git --version<\/code>.<\/p>\n<div class='call note'><b>Napomena<\/b>U Git Bash-u <strong>Ctrl+V ne radi<\/strong> i stvara neželjene efekte. Kopira se sa <strong>Ctrl+Insert<\/strong>, a lepi sa <strong>Shift+Insert<\/strong>.<\/div>"}, {"id": "01-4", "t": "Pravljenje repozitorijuma i snimanje promena", "h": "<p>Ako imate projekat koji želite da verzionirate pomoću Gita, u folderu projekta pokrećete:<\/p>\n<pre><code>$ git init                      # inicijalizacija repozitorijuma\n$ git status                    # pregled stanja fajlova\n$ git add index.php style.css   # stejdžovanje fajlova\n$ git add *                     # stejdžovanje svih fajlova\n$ git commit -m \"Inicijalizacija Git repozitorijuma\"\n$ git log                       # pregled komitova<\/code><\/pre>\n<p>Ako ukucate samo <code>git commit<\/code>, otvoriće se editor – u prvi red upisujete poruku, sačuvate fajl i komit se izvršava. Opcioni parametar <strong>-m<\/strong> označava „message“ i njime poruku prosleđujete direktno.<\/p>\n<p>Svaki put kada projekat dosegne stanje koje želite da zabeležite, ponavljate isti ciklus: izmenite fajlove, proverite ih sa <code>git status<\/code>, stejdžujete ih sa <code>git add<\/code> i komitujete sa <code>git commit<\/code>.<\/p>\n<h3>Izmena poslednjeg komita (amend)<\/h3>\n<p>Ako niste nešto dobro uradili u prethodnom komitu, na primer zaboravili ste da dodate neki fajl ili niste zadovoljni porukom, možete da „amend-ujete“ poslednji komit:<\/p>\n<pre><code>$ git commit -m 'initial commit'\n$ git add &lt;zaboravljeni-fajl&gt;\n$ git commit --amend<\/code><\/pre>\n<h3>Uklanjanje fajla sa stejdža<\/h3>\n<p>Ako još niste komitovali, a želite da uklonite neki fajl sa stejdža, koristite jednu od ovih komandi:<\/p>\n<pre><code>$ git reset HEAD &lt;fajl&gt;\n$ git restore --staged &lt;fajl&gt;   # novija opcija, predložena sredinom 2019.<\/code><\/pre>\n<h3>Razmodifikovanje modifikovanog fajla<\/h3>\n<p>Ako shvatite da ne želite da zadržite izmene u fajlu i hoćete da ga vratite u stanje iz poslednjeg komita, koristite:<\/p>\n<pre><code>$ git checkout -- &lt;fajl&gt;\n$ git restore &lt;fajl&gt;<\/code><\/pre>\n<div class='call warn'><b>Zamka<\/b><code>git checkout -- &lt;fajl&gt;<\/code> je <strong>opasna komanda<\/strong>. Svaka promena koju ste napravili u tom fajlu nestaje, jer Git kopira drugi fajl preko njega. Ne koristite je ako niste sigurni da vam promene više ne trebaju.<\/div>"}, {"id": "01-5", "t": "Rad sa udaljenim repozitorijumima", "h": "<p><strong>Udaljeni repozitorijumi<\/strong> (remote repositories, često samo „remotes“) su verzije projekta koje su hostovane na internetu ili negde na mreži. Možete ih imati nekoliko, a svaki je u opštem slučaju dostupan samo za čitanje (read-only) ili za čitanje i upis (read/write). Kolaboracija sa drugima podrazumeva upravljanje udaljenim repozitorijumima i <strong>guranje (push)<\/strong> i <strong>povlačenje (pull)<\/strong> podataka kada je potrebno podeliti rad.<\/p>\n<pre><code>$ git remote                                     # koji su udaljeni serveri konfigurisani\n$ git remote -v                                  # isto, sa URL adresama\n$ git remote add origin https://github.com/KorisnickoIme/ImeProjekta.git\n$ git push origin master                         # slanje lokalne master grane na origin<\/code><\/pre>\n<p>Komandom <code>git remote add origin ...<\/code> lokalni repozitorijum povezujete sa udaljenim. Nazivi <strong>origin<\/strong> i <strong>master<\/strong> nisu posebni – to su samo podrazumevani nazivi koji se mogu promeniti.<\/p>\n<div class='call note'><b>Napomena<\/b><code>git push origin master<\/code> radi samo ako imate <strong>pristup pisanja<\/strong> na server i ako <strong>niko nije slao podatke u međuvremenu<\/strong>.<\/div>\n<h3>Kloniranje i povlačenje promena<\/h3>\n<p>Kopija postojećeg repozitorijuma se pribavlja komandom <code>git clone [url]<\/code>. Promene koje su drugi poslali na server preuzimate komandom <code>git pull origin master<\/code>. Preporučljivo je da pre početka rada uvek pokrenete <code>git pull<\/code>, da biste na svom računaru imali najnoviju verziju.<\/p>\n<h3>Tagovi<\/h3>\n<p>Tagovima se označavaju važne tačke u istoriji, najčešće verzije:<\/p>\n<pre><code>$ git tag -a v1.0 -m \"moja verzija 1.0\"   # dodavanje taga\n$ git push                                # push izmena\n$ git push origin v1.0                    # push taga<\/code><\/pre>\n<div class='call warn'><b>Zamka<\/b>Tagovi se ne šalju običnim <code>git push<\/code> – potrebno ih je poslati posebno: <code>git push origin v1.0<\/code>.<\/div>"}, {"id": "01-6", "t": "Rešavanje konflikta i merge", "h": "<p>U skripti je opisana situacija koja se često dešava u realnom radu. Dva kolaboratora izmene isti fajl <code>style.css<\/code> na različit način. Prvi snimi promene i push-uje ih na GitHub. Kada drugi kolaborator pokuša da uradi push, on biva <strong>odbijen<\/strong>, a Git mu predlaže da prvo uradi <code>git pull<\/code>.<\/p>\n<p>Kada drugi kolaborator pozove <code>git pull origin master<\/code>, nastaje <strong>konflikt<\/strong> u fajlu i on mora da odluči koje izmene čuva. U VS Code-u može da izabere:<\/p>\n<ul>\n<li><strong>Accept Current Change<\/strong> – zadržava svoje promene,<\/li>\n<li><strong>Accept Incoming Change<\/strong> – zadržava promene koje stižu sa udaljenog servera,<\/li>\n<li><strong>Accept Both Changes<\/strong> – zadržava obe.<\/li>\n<\/ul>\n<p>Kada reši konflikt, stejdžuje i komituje promene i push-uje ih na GitHub. Prvi kolaborator zatim komandom <code>git pull origin master<\/code> dobija fajlove sa rešenim konfliktima.<\/p>"}, {"id": "01-7", "t": "Git Ignore", "h": "<p>Često ćete imati grupu fajlova koju ne želite da Git automatski dodaje, pa čak ni da vam ih prikazuje kao nepraćene. To su obično automatski generisani fajlovi, kao što su logovi ili fajlovi nastali bildovanjem. U tim slučajevima pravite obrasce koji ih „gađaju“ i stavljate ih u fajl <strong>.gitignore<\/strong>.<\/p>\n<p>Pravila za obrasce u .gitignore fajlu su sledeća:<\/p>\n<ul>\n<li>prazne linije i linije koje počinju sa <code>#<\/code> se ignorišu,<\/li>\n<li>standardni <strong>glob<\/strong> obrasci (pojednostavljene regularne ekspresije koje koriste šelovi) rade,<\/li>\n<li>obrazac možete početi kosom crtom <code>/<\/code> da biste izbegli rekurziju,<\/li>\n<li>obrazac možete završiti kosom crtom <code>/<\/code> da biste označili direktorijum,<\/li>\n<li>obrazac možete negirati tako što ćete ga početi znakom uzvika <code>!<\/code>.<\/li>\n<\/ul>\n<div class='tw'><table><thead><tr><th>Obrazac<\/th><th>Značenje<\/th><\/tr><\/thead><tbody><tr><td><code>*.a<\/code><\/td><td>bez .a fajlova<\/td><\/tr><tr><td><code>!lib.a<\/code><\/td><td>ali prati lib.a, iako se .a fajlovi ignorišu<\/td><\/tr><tr><td><code>/TODO<\/code><\/td><td>ignoriši samo TODO fajl u trenutnom direktorijumu, ne i poddir/TODO<\/td><\/tr><tr><td><code>build/<\/code><\/td><td>ignoriši sve fajlove u build/ direktorijumu<\/td><\/tr><tr><td><code>doc/*.txt<\/code><\/td><td>ignoriši doc/notes.txt, ali ne doc/server/arch.txt<\/td><\/tr><tr><td><code>doc/**/*.pdf<\/code><\/td><td>ignoriši sve .pdf fajlove u doc/ direktorijumu i njegovim poddirektorijumima<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Na primer, ako želite da ignorišete <code>server.log<\/code> u korenu repozitorijuma i <code>cache<\/code> folder, napravite .gitignore fajl, upišete u njega <code>cache/<\/code> i <code>server.log<\/code>, a zatim .gitignore stejdžujete i komitujete. Posle toga Git više ne prati te fajlove.<\/p>\n<div class='call note'><b>Napomena<\/b>U projektima sa vežbi .gitignore uvek sadrži <code>node_modules<\/code>, a u Next.js projektu i <code>.env*<\/code> – zato fajl sa lozinkama ne završava na GitHub-u.<\/div>"}, {"id": "01-8", "t": "Pregled istorije komitova i vraćanje na stariju verziju", "h": "<p>Najosnovniji i najmoćniji alat za pregled istorije je komanda <code>git log<\/code>. Za lepši prikaz mogu se proslediti opcioni parametri, npr. <code>git log --pretty --graph<\/code>, a iz prikaza se izlazi tasterom <strong>q<\/strong>.<\/p>\n<p>Na stariju verziju projekta vraćate se komandom <code>git checkout &lt;checksum&gt;<\/code>, gde je checksum heš komita (npr. <code>907db28<\/code>). Dovoljno je navesti prvih nekoliko cifara heša.<\/p>"}, {"id": "01-9", "t": "Grananje i spajanje", "h": "<p><strong>Grananje<\/strong> znači da se odvajate od glavne linije razvoja i nastavljate rad bez uticaja na tu glavnu liniju. Glavna grana je obično i produkciona grana – grana na kojoj se objavljuju testirane i stabilne verzije softvera. Zato se novo rešenje prvo testira na posebnoj grani, pa se tek onda uključuje u glavnu.<\/p>\n<pre><code>$ git branch testing                          # pravljenje nove grane \"testing\"\n$ git checkout testing                        # prelazak na granu \"testing\"\n$ git commit -a -m \"Dodat heading 2\"          # -a automatski stejdžuje izmenjene fajlove\n$ git log --oneline --decorate --graph --all  # prikaz grana i komitova\n$ git checkout master                         # povratak na master granu\n$ git merge testing                           # spajanje testing grane u master\n$ git push origin master                      # slanje na udaljeni server<\/code><\/pre>\n<p>Ako pri spajanju nastane konflikt, rešava se na isti način kao gore (u primeru iz skripte izabrano je „Accept Both Changes“), a zatim se promene komituju.<\/p>\n<div class='call warn'><b>Zamka<\/b>Spajanje se pokreće sa grane <strong>u koju<\/strong> se spaja: prvo <code>git checkout master<\/code>, pa <code>git merge testing<\/code>.<\/div>"}, {"id": "01-10", "t": "SSH povezivanje sa GitHub-om", "h": "<p>Umesto korisničkog imena i lozinke, lokalni repozitorijum se sa GitHub-om može povezati preko <strong>SSH ključa<\/strong>. Ključ se generiše komandom:<\/p>\n<pre><code>ssh-keygen -t rsa -C \"{VAŠA_EMAIL_ADRESA_SA_GITHUBa}\"<\/code><\/pre>\n<p>Pri generisanju ključ dobija ime (na vežbama u formatu <strong>abxxxxyyyy<\/strong> – inicijali, godina upisa i broj indeksa) i šifru, koja se ne vidi dok se kuca. Nastaju dva fajla: <strong>privatni ključ<\/strong> i <strong>javni ključ<\/strong> sa ekstenzijom <strong>.pub<\/strong>.<\/p>\n<p>Zatim se pokreće SSH agent i u njega dodaje privatni ključ:<\/p>\n<pre><code>eval `ssh-agent -s`\nssh-add C:\\\\Users\\\\Tami\\\\.ssh\\\\tn20185005<\/code><\/pre>\n<p>Na GitHub-u se u <strong>Settings → SSH and GPG keys → New SSH key<\/strong> nalepi sadržaj <strong>.pub<\/strong> fajla (Key type: Authentication Key). Kada se pri pravljenju repozitorijuma izabere SSH adresa i doda kao remote, komanda <code>git remote -v<\/code> potvrđuje da je lokalni repozitorijum povezan sa GitHub-om.<\/p>\n<div class='call warn'><b>Zamka<\/b>Na GitHub ide <strong>javni<\/strong> ključ (.pub fajl), dok <code>ssh-add<\/code> dobija <strong>privatni<\/strong> ključ.<\/div>"}, {"id": "01-11", "t": "Markdown (.md) fajlovi", "h": "<p>Markdown fajl je tekstualni dokument koji sadrži sadržaj formatiran pomoću Markdown sintakse. Jednostavan je i lako čitljiv, a često se koristi za pisanje sadržaja na vebu, dokumentacije, README fajlova, blogova i ostalih tekstualnih materijala.<\/p>\n<p>Osnovne karakteristike Markdown fajla:<\/p>\n<ul>\n<li><strong>Tekstualni format<\/strong> – to je tekstualni fajl sa ekstenzijom <strong>.md<\/strong> (npr. „primer.md“).<\/li>\n<li><strong>Jednostavna sintaksa<\/strong> – laka je za pisanje i čitanje; elementi formatiranja se definišu posebnim znacima, kao što su „#“ za naslove, „*“ i „-“ za liste, „[“ i „]“ za linkove.<\/li>\n<li><strong>Formatiranje sadržaja<\/strong> – omogućeni su brojni načini formatiranja teksta.<\/li>\n<li><strong>HTML konverzija<\/strong> – može se konvertovati u HTML i to mu je jedna od glavnih prednosti, jer omogućava lako deljenje sadržaja i prikaz na veb sajtovima.<\/li>\n<li><strong>Dodaci i ekstenzije<\/strong> – u VS Code-u postoje ekstenzije koje poboljšavaju rad sa Markdown-om, npr. „live preview“ (živi pregled dokumenta).<\/li>\n<\/ul>\n<div class='tw'><table><thead><tr><th>Element<\/th><th>Sintaksa<\/th><\/tr><\/thead><tbody><tr><td>Naslov<\/td><td><code># Naslov 1<\/code>, <code>## Naslov 2<\/code>, <code>### Naslov 3<\/code> – broj znakova # određuje nivo<\/td><\/tr><tr><td>Pasus<\/td><td>prazan red između dva teksta<\/td><\/tr><tr><td>Nenumerisana lista<\/td><td>znak <code>-<\/code> ili <code>*<\/code> ispred svake stavke<\/td><\/tr><tr><td>Numerisana lista<\/td><td>broj i tačka ispred svake stavke, npr. <code>1. Prva stavka<\/code><\/td><\/tr><tr><td>Link<\/td><td><code>[tekst koji će se prikazati](URL)<\/code><\/td><\/tr><tr><td>Slika<\/td><td><code>![alt tekst](URL slike)<\/code><\/td><\/tr><tr><td>Bold<\/td><td><code><strong>tekst<\/strong><\/code> ili <code>__tekst__<\/code><\/td><\/tr><tr><td>Italic<\/td><td><code>*tekst*<\/code> ili <code>_tekst_<\/code><\/td><\/tr><tr><td>Kod<\/td><td>tri znaka backtick na početku i na kraju koda (posle prvih se može navesti jezik, npr. python)<\/td><\/tr><tr><td>Citat<\/td><td><code>&gt; Ovo je citat.<\/code><\/td><\/tr><tr><td>Linija razdvajanja<\/td><td><code>---<\/code> ili <code>___<\/code><\/td><\/tr><tr><td>Tabela<\/td><td>ćelije se odvajaju znakom <code>|<\/code>, prvi red je zaglavlje, ispod njega red sa <code>---<\/code><\/td><\/tr><tr><td>Poravnanje u tabeli<\/td><td>levo <code>:---<\/code>, desno <code>---:<\/code>, centralno <code>:---:<\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>README.md<\/strong> fajl najčešće sadrži osnovne informacije o repozitorijumu: o čemu je projekat, u koje svrhe je pravljen, na koji način se koristi i koje su tehnologije, dokumentacija i zasluge (credits). GitHub ga prikazuje na početnoj stranici repozitorijuma.<\/p>"}, {"id": "01-12", "t": "Pull request", "h": "<p><strong>Pull request<\/strong> je funkcionalnost koja se često koristi u sistemima za kontrolu verzija kao što je GitHub, kako bi se olakšao timski rad i pregled koda. Za rad sa njim potrebno je razumeti tri pojma:<\/p>\n<ul>\n<li><strong>Branch (grana)<\/strong> je kopija glavne grane projekta (najčešće „master“ ili „main“) koja se koristi za izradu novih funkcija ili ispravke grešaka.<\/li>\n<li><strong>Fork (kopiranje)<\/strong> je proces kopiranja tuđeg Git repozitorijuma na vaš nalog. To omogućava rad na sopstvenoj verziji projekta, bez uticaja na originalni projekat.<\/li>\n<li><strong>Pull request (zahtev za povlačenje)<\/strong> je zahtev koji se šalje vlasniku originalnog projekta da bi se predstavile vaše promene i zatražilo da se one integrišu u glavnu granu. Tako drugi članovi tima mogu da pregledaju vaš kod i daju povratne informacije pre nego što se promene spoje.<\/li>\n<\/ul>\n<p>Opcije koje se najčešće koriste pri formiranju pull request-a su <strong>naslov i opis<\/strong>, <strong>ciljna grana<\/strong> (obično master ili main), <strong>recenzenti (Reviewers)<\/strong>, <strong>oznake (Labels)<\/strong> poput „ispravka greške“ ili „nova funkcija“, <strong>Milestone<\/strong> (faza razvoja ili verzija), <strong>Linked Issue<\/strong> (povezani problem), <strong>Draft Pull Request<\/strong> (PR koji još nije spreman za spajanje) i <strong>zaključavanje konverzacije<\/strong> nakon spajanja.<\/p>\n<p>Uobičajen tok je sledeći: napravite novu granu, na njoj napravite i komitujete promene, push-ujete granu na GitHub i na kartici <strong>Pull requests<\/strong> otvorite <strong>New Pull Request<\/strong>, birajući svoju granu kao izvor i master/main kao cilj. Recenzenti pregledaju izmene na kartici <strong>Files changed<\/strong>, komentarišu i daju odobrenje (approve), a zatim osoba sa ovlašćenjima klikne na <strong>Merge pull request<\/strong>. PR se može i zatvoriti bez spajanja (<strong>Close pull request<\/strong>).<\/p>\n<div class='tw'><table><thead><tr><th>Način spajanja<\/th><th>Šta radi<\/th><\/tr><\/thead><tbody><tr><td>Create a merge commit<\/td><td>Kreira novi commit koji spaja izmene iz PR-a u ciljnu granu, čuvajući istoriju commit-ova iz PR-a<\/td><\/tr><tr><td>Squash and merge<\/td><td>Spaja sve commit-ove iz PR-a u jedan jedinstveni commit, čineći istoriju „čistom“<\/td><\/tr><tr><td>Rebase and merge<\/td><td>„Rebazira“ izmene iz PR-a na vrh ciljne grane, održavajući linearnu istoriju commit-ova<\/td><\/tr><\/tbody><\/table><\/div>"}, {"id": "01-13", "t": "GitHub Pages", "h": "<p><strong>GitHub Pages<\/strong> je besplatna usluga koja omogućava hostovanje <strong>statičkih veb stranica<\/strong> direktno iz GitHub repozitorijuma. Repozitorijum se mora zvati u formatu <strong>korisnickoIme.github.io<\/strong> – tako ga GitHub Pages automatski prepoznaje kao vašu veb stranicu. HTML, CSS i JavaScript fajlovi se postavljaju u root direktorijum repozitorijuma, a u podešavanjima repozitorijuma (Settings → GitHub Pages) bira se grana (main). Stranica je zatim dostupna na adresi <code>https://korisnickoIme.github.io<\/code>.<\/p>"}]}, {"id": "02", "t": "Docker", "l": [{"id": "02-1", "t": "Šta je Docker", "h": "<p>Docker <strong>pakuje aplikaciju i sve njene zavisnosti u jednu standardizovanu, izolovanu jedinicu<\/strong>. Formalno, Docker je skup proizvoda tipa <strong>PaaS (Platform as a Service)<\/strong> koji koriste <strong>virtuelizaciju na nivou operativnog sistema<\/strong> za isporuku softvera u paketima koji se nazivaju <strong>kontejneri<\/strong>. Prvi put je pokrenut <strong>2013.<\/strong> godine, a razvila ga je kompanija <strong>Docker, Inc.<\/strong><\/p>\n<p>Osnovna ideja Docker-a je da omogući konzistentno izvršavanje aplikacija bez obzira na okruženje u kojem se pokreću, bez brige o različitim zavisnostima i konfiguracijama sistema. Kontejneri se lako prenose i pokreću na različitim platformama – na lokalnim serverima, virtuelnim mašinama i u cloud-u – pa Docker podržava i <strong>kontinualnu integraciju i isporuku (CI/CD)<\/strong>. Docker ima bogat ekosistem (<strong>Docker Hub<\/strong>) za deljenje gotovih slika, a podržava i orkestraciju kontejnera pomoću alata kao što su <strong>Docker Compose, Kubernetes i Docker Swarm<\/strong>.<\/p>\n<h3>„Na mojoj mašini radi“<\/h3>\n<p>Potreba za nezavisnim i standardizovanim aplikacijama proizilazi prvenstveno iz rešavanja čuvenog problema <strong>„na mojoj mašini radi“<\/strong>. Glavni razlozi za korišćenje kontejnera su:<\/p>\n<ol>\n<li>doslednost kroz različita okruženja,<\/li>\n<li>upravljanje skrivenim zavisnostima,<\/li>\n<li>izolacija i sprečavanje konflikata,<\/li>\n<li>efikasnost i brzina,<\/li>\n<li>produktivnost i skalabilnost.<\/li>\n<\/ol>\n<h3>Docker vs virtuelne mašine<\/h3>\n<p>Docker deli jezgro (kernel) host operativnog sistema – nema „Guest OS“ balasta, već sadrži samo ono što je aplikaciji zaista potrebno. Hardverska virtuelizacija, sa druge strane, stvara ogroman overhead, jer svaka aplikacija vuče ceo operativni sistem sa sobom. Obe tehnologije služe za izolaciju aplikacija, ali to postižu na suštinski različite načine:<\/p>\n<div class='tw'><table><thead><tr><th>Karakteristika<\/th><th>Virtuelne mašine (VM)<\/th><th>Docker kontejneri<\/th><\/tr><\/thead><tbody><tr><td>Nivo virtuelizacije<\/td><td>Virtuelizacija na nivou hardvera pomoću hipervizora<\/td><td>Virtuelizacija na nivou operativnog sistema<\/td><\/tr><tr><td>Operativni sistem<\/td><td>Svaka VM pokreće sopstveni, kompletni Guest OS<\/td><td>Kontejneri dele kernel host operativnog sistema<\/td><\/tr><tr><td>Veličina<\/td><td>Slike su obično velike, više gigabajta (GB)<\/td><td>Slike su lagane, obično svega megabajte (MB)<\/td><\/tr><tr><td>Brzina startovanja<\/td><td>Potrebni su minuti da se OS butuje<\/td><td>Pokreću se gotovo trenutno, za manje od sekunde<\/td><\/tr><tr><td>Performanse<\/td><td>Značajan overhead zbog emulacije celog hardvera<\/td><td>Blizu nativnih performansi, jer nema emulacije hardvera<\/td><\/tr><tr><td>Izolacija<\/td><td>Potpuna izolacija procesa i resursa na hardverskom nivou<\/td><td>Izolacija na nivou procesa (namespaces i cgroups)<\/td><\/tr><tr><td>Efikasnost resursa<\/td><td>Manje efikasno; resursi su fiksno dodeljeni svakoj VM<\/td><td>Visoka efikasnost; troše samo onoliko koliko im je potrebno<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>Docker flow<\/h3>\n<ol>\n<li><strong>Kreiranje Dockerfile-a<\/strong> – developer kreira tekstualni fajl koji sadrži sve instrukcije i zavisnosti potrebne za pokretanje aplikacije.<\/li>\n<li><strong>Generisanje Docker image-a<\/strong> – iz Dockerfile-a se gradi „blueprint“ (slika) koji služi kao osnova za kreiranje servisa.<\/li>\n<li><strong>Pokretanje kontejnera<\/strong> – na osnovu image-a pokreće se kontejner, živa i izolovana instanca aplikacije.<\/li>\n<li><strong>Docker Hub i okruženja<\/strong> – image se šalje na Docker Hub, odakle se povlači na različita okruženja, poput staging-a ili testing-a.<\/li>\n<li><strong>Isporuka klijentu<\/strong> – finalizovana aplikacija se klijentu prikazuje u stabilnom, izolovanom i predvidivom okruženju.<\/li>\n<\/ol>\n<p>Docker je savršen alat za <strong>mikroservise<\/strong>, jer je svaki deo sistema pokrenut u svom kontejneru. To donosi nezavisno skaliranje svakog servisa, agnosticizam jezika (svaki tim bira svoju tehnologiju) i lokalizaciju grešaka.<\/p>"}, {"id": "02-2", "t": "Docker arhitektura", "h": "<p>Docker arhitekturu čine sledeće komponente:<\/p>\n<ul>\n<li><strong>Docker Daemon<\/strong> – pozadinski proces koji upravlja Docker kontejnerima na sistemu. Odgovoran je za izvršavanje komandi koje se šalju preko Docker CLI-ja.<\/li>\n<li><strong>Docker CLI (Command Line Interface)<\/strong> – korisnički interfejs preko kog korisnici komuniciraju sa Docker-om i upravljaju kontejnerima, mrežama, volumenima i drugim Docker objektima.<\/li>\n<li><strong>Docker Client<\/strong> – Docker CLI koristi Docker Client da šalje komande Docker Daemonu. Client može komunicirati sa lokalnim Daemonom ili sa Daemonom na udaljenom serveru.<\/li>\n<li><strong>Docker Images<\/strong> – slike predstavljaju upakovan softver, uključujući aplikacije i sve njihove zavisnosti, u jednu celinu. Koriste se kao temelj za kreiranje i pokretanje kontejnera.<\/li>\n<li><strong>Docker Containers<\/strong> – kontejneri su instance Docker slika koje se izvršavaju u izolovanom okruženju. Oni su pokrenute kopije slika i omogućavaju izolaciju, prenosivost i laku reprodukciju aplikacija.<\/li>\n<li><strong>Docker Registry<\/strong> – skladište za Docker slike. <strong>Docker Hub<\/strong> je javni registry koji omogućava deljenje i preuzimanje slika, a mogu se koristiti i privatni registri.<\/li>\n<\/ul>\n<h3>Docker slike i kontejneri ukratko<\/h3>\n<p>Docker slike (images) se koriste za pakovanje i distribuciju softvera, zajedno sa bibliotekama i konfiguracijama, kao nezavisne jedinice koje se lako implementiraju na različitim okruženjima. <strong>Slika je u suštini šablon na osnovu kog se prave Docker kontejneri.<\/strong> Da biste kreirali sliku, potrebno je da definišete <strong>Dockerfile<\/strong> – skriptu koja određuje baznu sliku, pakete za instaliranje, fajlove za kopiranje i druga podešavanja.<\/p>\n<p>Docker kontejneri su <strong>izolovane jedinice za izvršavanje aplikacija<\/strong>, koje omogućavaju konzistentno funkcionisanje softvera bez obzira na okruženje. Posebno su korisni za razvoj i testiranje, implementaciju (deploy), arhitekturu mikroservisa i CI/CD procese.<\/p>\n<div class='call note'><b>Napomena<\/b>Da li je Docker ispravno instaliran, proverava se komandom <code>docker run hello-world<\/code>. Na Windows-u je za Docker Desktop preduslov uključena virtuelizacija u BIOS-u. Na Linux-u se Docker instalira iz zvaničnog Docker APT repozitorijuma (paketi docker-ce, docker-ce-cli, containerd.io, docker-buildx-plugin, docker-compose-plugin).<\/div>"}, {"id": "02-3", "t": "Docker images", "h": "<p>Postoje dve vrste slika: <strong>built-in<\/strong> i <strong>custom<\/strong>.<\/p>\n<p><strong>Built-in<\/strong> slike su unapred definisane slike koje se automatski preuzimaju sa Docker Hub-a kada se korisnik odluči da pokrene određeni kontejner. To su obično osnovne slike operativnih sistema (ubuntu, debian, Alpine), programskih jezika (python, node), baza podataka (mysql, postgres) ili veb servera (nginx, httpd). Preuzimaju se komandom <code>docker pull &lt;ime&gt;<\/code>.<\/p>\n<p><strong>Custom<\/strong> (prilagođene) slike kreira korisnik ili razvojni tim prema specifičnim potrebama aplikacije. Grade se pomoću <strong>Dockerfile-a<\/strong>, koji definiše korake za instalaciju zavisnosti, podešavanje okruženja i postavljanje aplikacije u kontejner.<\/p>\n<h3>Dockerfile<\/h3>\n<p>Dockerfile se pravi u folderu projekta i zove se <strong>Dockerfile<\/strong> ili <strong>dockerfile<\/strong>. Primer iz skripte (Node.js aplikacija 1-node):<\/p>\n<pre><code>FROM node:18\nWORKDIR /app\nCOPY package.json /app\nRUN npm install\nCOPY . /app\nEXPOSE 80\nCMD [\"node\", \"server.js\"]<\/code><\/pre>\n<ol>\n<li><strong>FROM node:18<\/strong> – postavlja osnovnu (baznu) sliku na Node.js verziju 18.<\/li>\n<li><strong>WORKDIR /app<\/strong> – postavlja radni direktorijum u slici na „/app“; sve naredne komande se izvršavaju u njemu.<\/li>\n<li><strong>COPY package.json /app<\/strong> – kopira lokalni package.json u /app. Radi se odvojeno kako bi se omogućila optimalna upotreba <strong>keša<\/strong> tokom npm install koraka.<\/li>\n<li><strong>RUN npm install<\/strong> – izvršava komandu unutar slike i instalira sve zavisnosti iz package.json-a.<\/li>\n<li><strong>COPY . /app<\/strong> – kopira sve fajlove iz trenutnog lokalnog direktorijuma (prvi parametar) u /app u slici (drugi parametar).<\/li>\n<li><strong>EXPOSE 80<\/strong> – označava da će kontejner zasnovan na ovoj slici biti dostupan na portu 80. Linija nije obavezna, ali je informativna i koristi se pri mapiranju portova.<\/li>\n<li><strong>CMD [\"node\", \"server.js\"]<\/strong> – postavlja podrazumevanu komandu koja se izvršava kada se kontejner pokrene.<\/li>\n<\/ol>\n<p>Pored ovih, u Dockerfile-u se koriste i:<\/p>\n<ul>\n<li><strong>ARG<\/strong> – definiše promenljive koje se koriste <strong>samo tokom izgradnje<\/strong> slike; nisu dostupne u kontejneru koji se pokreće iz te slike.<\/li>\n<li><strong>ENV<\/strong> – postavlja promenljive okruženja koje su <strong>dostupne u kontejneru<\/strong> tokom izvršavanja i mogu se koristiti u aplikaciji. Mogu se zadati i pri pokretanju kontejnera opcijom <code>docker run -e<\/code>.<\/li>\n<li><strong>VOLUME<\/strong> – definiše volumene koje kontejner deli sa drugim kontejnerima ili spoljašnjim sistemom.<\/li>\n<\/ul>\n<div class='call warn'><b>Zamka<\/b>Komande <strong>EXPOSE<\/strong> i <strong>CMD<\/strong> se <strong>ne izvršavaju pri kreiranju slike<\/strong>, već pri kreiranju kontejnera. RUN se izvršava pri build-u slike.<\/div>\n<h3>Build slike i keširanje<\/h3>\n<p>Slika se gradi komandom <strong>docker build<\/strong>:<\/p>\n<pre><code>docker build -t IME_SLIKE:OZNAKA PUTANJA_DO_DOCKERFAJLA\ndocker build -t wishlist-app .<\/code><\/pre>\n<p>Opcija <strong>-t<\/strong> zadaje ime i oznaku (tag) slike, a tačka označava trenutni direktorijum u kom se nalazi Dockerfile. Tokom build-a Docker učitava Dockerfile i fajl <strong>.dockerignore<\/strong> (ako postoji – određuje koje fajlove ne treba kopirati), preuzima baznu sliku sa Docker Hub-a ako nije dostupna lokalno, izvršava korake redom i na kraju slici dodeljuje ID, naziv i tag.<\/p>\n<p>Ako ponovo pokrenete isti build bez izmena, koraci dobijaju oznaku <strong>[CACHED]<\/strong> – Docker koristi keširane rezultate iz prethodnih build-ova umesto da ih ponovo izvršava. Kada se promeni nešto u kodu, Docker primenjuje <strong>invalidaciju keša<\/strong> za korake posle promenjene linije, pa se oni ponovo izvršavaju. Zato se package.json kopira i <code>npm install<\/code> izvršava <strong>pre<\/strong> kopiranja ostatka koda: promena koda ne pokreće ponovnu instalaciju paketa.<\/p>\n<p><strong>Tag<\/strong> se koristi za razlikovanje različitih verzija iste slike (npr. <code>wishlist-app:v2<\/code>). Ako se tag ne navede, podrazumeva se <strong>latest<\/strong>, ali je preporučljivo izbegavati latest i eksplicitno navesti verziju.<\/p>\n<h3>Komande za slike<\/h3>\n<div class='tw'><table><thead><tr><th>Komanda<\/th><th>Šta radi<\/th><\/tr><\/thead><tbody><tr><td><code>docker images<\/code><\/td><td>Prikazuje sve slike – kolone REPOSITORY, TAG, IMAGE ID, CREATED, SIZE<\/td><\/tr><tr><td><code>docker inspect IMAGE_ID_or_NAME<\/code><\/td><td>Specifikacije slike: Id, RepoTags, Created, ExposedPorts, Env, Cmd, WorkingDir, Os, Size, Layers<\/td><\/tr><tr><td><code>docker tag SOURCE_IMAGE[:TAG] TARGET_IMAGE[:TAG]<\/code><\/td><td>Dodela ili promena oznake slike<\/td><\/tr><tr><td><code>docker rmi IMAGE[:TAG]<\/code><\/td><td>Briše sliku koju ne koristi nijedan kontejner<\/td><\/tr><tr><td><code>docker rmi -f IMAGE[:TAG]<\/code><\/td><td>Briše sliku i kada je koristi kontejner (kontejner se ne briše)<\/td><\/tr><tr><td><code>docker pull IMAGE<\/code><\/td><td>Preuzima sliku sa Docker Hub-a<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Slojevi (Layers)<\/strong> čine Docker sliku – svaki korak u Dockerfile-u čini jedan sloj. Slojevi omogućavaju efikasno deljenje i keširanje, jer se pri ažuriranju slike ponovo izrađuju samo izmenjeni slojevi.<\/p>"}, {"id": "02-4", "t": "Docker containers", "h": "<p>Za pokretanje kontejnera potrebne su slike. Kontejner se pokreće komandom <strong>docker run<\/strong>:<\/p>\n<pre><code>docker run [OPTIONS] IMAGE[:TAG] [COMMAND] [ARG...]<\/code><\/pre>\n<div class='tw'><table><thead><tr><th>Opcija<\/th><th>Značenje<\/th><\/tr><\/thead><tbody><tr><td><code>-p HOST_PORT:CONTAINER_PORT<\/code><\/td><td>Mapiranje portova; <code>-p 8080:80<\/code> znači da je port 80 u kontejneru dostupan na portu 8080 lokalnog sistema<\/td><\/tr><tr><td><code>-d<\/code><\/td><td>Pokreće kontejner u pozadini (detached) i oslobađa terminal<\/td><\/tr><tr><td><code>--rm<\/code><\/td><td>Kontejner se automatski briše kada se zaustavi<\/td><\/tr><tr><td><code>--name ime<\/code><\/td><td>Dodeljuje ime kontejneru (inače ga Docker dodeljuje sam)<\/td><\/tr><tr><td><code>-it<\/code><\/td><td>Interaktivni režim, npr. <code>docker run -it ubuntu bash<\/code><\/td><\/tr><tr><td><code>-e KLJUC=vrednost<\/code><\/td><td>Postavlja environment varijablu<\/td><\/tr><tr><td><code>-v ...<\/code><\/td><td>Povezuje volumen<\/td><\/tr><tr><td><code>--network ime<\/code><\/td><td>Povezuje kontejner na mrežu<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Primer: <code>docker run --rm -d -p 8080:80 --name web-server wishlist-app<\/code> pokreće kontejner u pozadini, sa imenom web-server, mapiranim portom i automatskim brisanjem po zaustavljanju.<\/p>\n<p>Kontejner pokrenut bez <code>-d<\/code> koji izvršava server <strong>blokira terminal<\/strong>. Kontejner koji nema aktivan proces (npr. <code>docker run ubuntu<\/code>) se odmah zatvara, jer nema zadatka koji bi ga održavao.<\/p>\n<h3>Komande za upravljanje kontejnerima<\/h3>\n<div class='tw'><table><thead><tr><th>Komanda<\/th><th>Šta radi<\/th><\/tr><\/thead><tbody><tr><td><code>docker ps<\/code><\/td><td>Prikazuje trenutno pokrenute kontejnere<\/td><\/tr><tr><td><code>docker ps -a<\/code><\/td><td>Prikazuje sve kontejnere, i pokrenute i zaustavljene<\/td><\/tr><tr><td><code>docker stop<\/code><\/td><td>Zaustavlja pokrenut kontejner<\/td><\/tr><tr><td><code>docker start<\/code><\/td><td>Ponovo pokreće zaustavljen kontejner, u pozadini<\/td><\/tr><tr><td><code>docker start -a<\/code><\/td><td>Pokreće kontejner i prikazuje njegov izlaz u terminalu<\/td><\/tr><tr><td><code>docker restart<\/code><\/td><td>Ponovo pokreće kontejner<\/td><\/tr><tr><td><code>docker rm<\/code><\/td><td>Trajno uklanja kontejner – pokrenut kontejner se ne može obrisati, prvo se zaustavlja<\/td><\/tr><tr><td><code>docker logs<\/code><\/td><td>Prikazuje logove (izlaz) kontejnera<\/td><\/tr><tr><td><code>docker attach<\/code><\/td><td>Priključuje terminal na pokrenut kontejner<\/td><\/tr><tr><td><code>docker inspect<\/code><\/td><td>Detaljne informacije o kontejneru (konfiguracija, mreža, stanje)<\/td><\/tr><tr><td><code>docker exec -it ime komanda<\/code><\/td><td>Izvršava komandu u pokrenutom kontejneru<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Kontejner se u komandama navodi po ID-ju (dovoljno je prvih nekoliko karaktera) ili po imenu. Ispis <code>docker ps<\/code> ima kolone <strong>CONTAINER ID, IMAGE, COMMAND, CREATED, STATUS, PORTS i NAMES<\/strong>. Kontejner može biti u statusu <strong>Up<\/strong> (radi), <strong>Exited<\/strong> (završio izvršavanje), <strong>Paused<\/strong>, <strong>Restarting<\/strong>, <strong>Creating<\/strong> ili <strong>Removing<\/strong>.<\/p>\n<h3>ARG i ENV na primeru<\/h3>\n<p>Primer 7-flask (PHP + Apache) pokazuje razliku između ARG i ENV varijabli:<\/p>\n<pre><code>FROM php:7.4-apache\nARG APACHE_DOCUMENT_ROOT=/var/www/html\nENV APACHE_DOCUMENT_ROOT=${APACHE_DOCUMENT_ROOT}\nENV APP_FACULTY=fakultet\n...<\/code><\/pre>\n<p>Ako se kontejner pokrene sa <code>docker run -e APP_FACULTY=FON -p 81:80 php-csv-app<\/code>, varijabla APP_FACULTY dobija vrednost FON. Ako se <code>-e<\/code> ne navede, ima podrazumevanu vrednost „fakultet“ iz Dockerfile-a.<\/p>"}, {"id": "02-5", "t": "Docker Hub", "h": "<p><strong>Docker Hub<\/strong> je usluga koju pruža Docker za pronalaženje i deljenje slika kontejnera. To je najveće svetsko skladište slika kontejnera, koje pored slika pojedinaca i timova podržava i projekte otvorenog koda i nezavisne dobavljače softvera. Na njega se prijavljujete komandom <code>docker login<\/code>. Stranica ima delove <strong>Explore<\/strong>, <strong>Repositories<\/strong> (vaše slike) i <strong>Organizations<\/strong> (timski projekti), a u filterima se nalazi <strong>Trusted content<\/strong> – slike koje je Docker Inc. verifikovao.<\/p>"}, {"id": "02-6", "t": "Docker volume", "h": "<p><strong>Docker volume<\/strong> (volumen) je mehanizam za čuvanje i deljenje podataka između Docker kontejnera i matičnog sistema. Volumeni su posebne vrste direktorijuma ili datoteka kojima upravlja Docker.<\/p>\n<p>Bez volumena, fajlovi napravljeni u kontejneru <strong>ne vezuju se za sliku, već za kontejner<\/strong> – kada se napravi novi kontejner iz iste slike, tih fajlova u njemu nema.<\/p>\n<p>Postoji nekoliko vrsta volumena:<\/p>\n<ul>\n<li><strong>Imenovani volumeni (named volumes)<\/strong> imaju ime. Docker ih kreira i upravlja njima, a ostaju i nakon što se kontejner koji ih koristi zaustavi ili ponovo pokrene. Dobar su izbor za podatke koji se dele između više kontejnera ili koji moraju da se zadrže.<\/li>\n<li><strong>Anonimni volumeni (anonymous volumes)<\/strong> nemaju ime. Docker ih kreira kada se kontejner pokrene, a uništavaju se kada se kontejner zaustavi. Dobar su izbor za privremene podatke.<\/li>\n<li><strong>Bind mount<\/strong> predstavlja način da se direktorijum sa matične mašine montira u kontejner. Tako se podaci dele između kontejnera i matične mašine.<\/li>\n<\/ul>\n<div class='tw'><table><thead><tr><th>Tip volumena<\/th><th>Prednosti<\/th><th>Nedostaci<\/th><\/tr><\/thead><tbody><tr><td>Imenovani<\/td><td>Perzistencija i mogućnost deljenja između više kontejnera<\/td><td>–<\/td><\/tr><tr><td>Neimenovani<\/td><td>Jednostavnost i prolaznost<\/td><td>Nema perzistencije; nemogućnost deljenja<\/td><\/tr><tr><td>Bind mount<\/td><td>Performanse i fleksibilnost<\/td><td>Bezbednost i složenija konfiguracija<\/td><\/tr><\/tbody><\/table><\/div>\n<div class='tw'><table><thead><tr><th>Sintaksa<\/th><th>Tip<\/th><\/tr><\/thead><tbody><tr><td><code>-v message:/app/message<\/code><\/td><td>Imenovani volumen – IME:PUTANJA_U_KONTEJNERU<\/td><\/tr><tr><td><code>-v /app/node_modules<\/code><\/td><td>Anonimni volumen – samo putanja u kontejneru<\/td><\/tr><tr><td><code>-v \"C:\\...\\3-volumes:/app\"<\/code><\/td><td>Bind mount – APSOLUTNA_PUTANJA_NA_HOSTU:PUTANJA_U_KONTEJNERU<\/td><\/tr><tr><td><code>VOLUME [ \"/app/message\" ]<\/code><\/td><td>Anonimni volumen definisan u Dockerfile-u<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Može postojati više volumena istovremeno, a svaki se navodi pod posebnom <code>-v<\/code> opcijom. Volumeni se listaju komandom <code>docker volume ls<\/code>, a brišu komandom <code>docker volume rm &lt;naziv&gt;<\/code>. Kada se kontejner ponovo kreira sa istim imenovanim volumenom, volumen se ne pregazi, već se koristi postojeći – pa su i podaci na mestu.<\/p>\n<p>Bind mount omogućava da se svaka promena koda na matičnoj mašini odmah vidi u kontejneru, bez pravljenja nove slike. Kada se ceo projekat montira na <code>/app<\/code>, on prekrije i <code>node_modules<\/code> iz slike, pa aplikacija prijavljuje grešku da ne može da pronađe express. Problem se rešava dodatnim anonimnim volumenom <code>-v /app/node_modules<\/code>, jer <strong>prednost ima volumen koji ima specifičniju putanju u kontejneru<\/strong>.<\/p>"}, {"id": "02-7", "t": "Docker network", "h": "<p>Networking u Docker-u omogućava komunikaciju između kontejnera, kao i između kontejnera i drugih servisa ili uređaja. Postoje tri vrste komunikacije:<\/p>\n<ol>\n<li>komunikacija kontejnera sa <strong>www<\/strong> (npr. javni API) – radi bez dodatnog podešavanja,<\/li>\n<li>komunikacija kontejnera sa <strong>lokalnim računarom<\/strong> (npr. baza na matičnoj mašini),<\/li>\n<li>komunikacija <strong>kontejnera sa kontejnerom<\/strong> (npr. aplikacija i SQL baza).<\/li>\n<\/ol>\n<p>Tipovi Docker mrežnih drajvera:<\/p>\n<div class='tw'><table><thead><tr><th>Drajver<\/th><th>Opis<\/th><\/tr><\/thead><tbody><tr><td>bridge<\/td><td>Podrazumevani drajver; povezuje kontejnere na istoj host mašini, koji mogu i da pristupe internetu<\/td><\/tr><tr><td>host<\/td><td>Kontejneri dele mrežu i IP adresu sa host mašinom – nema izolacije<\/td><\/tr><tr><td>none<\/td><td>Kontejneri su potpuno izolovani i nemaju mrežnu vezu<\/td><\/tr><tr><td>overlay<\/td><td>Povezuje više Docker demona, pa kontejneri komuniciraju preko više host mašina<\/td><\/tr><tr><td>ipvlan<\/td><td>Puna kontrola nad IPv4 i IPv6 adresiranjem kontejnera<\/td><\/tr><tr><td>macvlan<\/td><td>Dodeljuje MAC adrese kontejnerima<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>Komunikacija sa matičnom mašinom<\/h3>\n<p>Kontejneri i matična mašina imaju odvojene mreže, pa kontejner ne može da pristupi bazi na računaru preko <code>localhost<\/code>. Umesto toga koristi se adresa virtuelnog mrežnog mosta <strong>docker0<\/strong> (npr. 172.17.0.1), koju prikazuje komanda <code>ip addr show docker0<\/code>. docker0 služi kao „kapija“ (gateway) između kontejnera i fizičkog računara.<\/p>\n<h3>Komunikacija kontejnera sa kontejnerom<\/h3>\n<p>Kada je i baza u kontejneru, komunikacija je lakša. Baza se pokreće iz slike sa Docker Hub-a, uz env varijable za korisnika i bazu:<\/p>\n<pre><code>docker run --name mysql-server -e MYSQL_ROOT_PASSWORD=mypassword -e MYSQL_DATABASE=swfavorites -e MYSQL_USER=novi -e MYSQL_PASSWORD=novi -d mysql:latest<\/code><\/pre>\n<p>Kontejneri mogu komunicirati preko <strong>adrese<\/strong> ili preko <strong>mreže<\/strong>. Adresa kontejnera se dobija komandom <code>docker container inspect mysql-server<\/code> (polje IPAddress, npr. 172.17.0.3). Mana ovog pristupa je što se IP adresa može promeniti, pa bi se morala ponovo tražiti i menjati u kodu.<\/p>\n<p>Bolje rešenje je <strong>Docker mreža<\/strong>:<\/p>\n<pre><code>docker network create app-network\ndocker network connect app-network mysql-server\ndocker run --name fav4 -d --rm -p 3003:3000 --network app-network fav-node:net<\/code><\/pre>\n<p>Kontejner se na mrežu povezuje na dva načina: opcijom <code>--network<\/code> pri pokretanju, ili komandom <code>docker network connect<\/code> za već pokrenut kontejner. Kada su aplikacija i baza na istoj mreži, umesto IP adrese u kodu se kao host koristi <strong>naziv kontejnera<\/strong> (npr. <code>mysql-server<\/code>). Mreže se listaju komandom <code>docker network ls<\/code>.<\/p>\n<div class='call note'><b>Napomena<\/b>Kontejneru baze nije potrebna opcija <code>-p<\/code> ako mu pristupaju samo drugi kontejneri iz iste mreže. <code>-p<\/code> se koristi samo kada se pristupa sa matične mašine ili van kontejnerske mreže.<\/div>"}]}, {"id": "03", "t": "Docker Compose", "l": [{"id": "03-1", "t": "Šta je Docker Compose", "h": "<p><strong>Docker Compose<\/strong> je alat za definisanje i pokretanje <strong>multi-kontejnerskih aplikacija<\/strong>. Predstavlja ključnu komponentu za jednostavan i efikasan razvoj i deployment aplikacija.<\/p>\n<p>Sve komande koje smo do sada koristili da kreiramo slike, kontejnere, volumene i mreže i da podešavamo različite opcije kroz terminal, sada se mogu definisati <strong>unutar jednog YAML fajla<\/strong> i pokrenuti <strong>samo jednom komandom<\/strong> u terminalu.<\/p>\n<p>Compose se može koristiti kao <strong>plugin<\/strong> ili kao standalone komponenta. Na vežbama se koristi <strong>docker compose plugin<\/strong>, kao najnovija verzija ove funkcionalnosti, direktno ugrađena u Docker CLI – zato se komande pišu kao <code>docker compose ...<\/code>.<\/p>"}, {"id": "03-2", "t": "Compose fajl i YAML", "h": "<p><strong>YAML (YAML Ain't Markup Language)<\/strong> je format koji se često koristi za konfiguracione fajlove. Docker Compose koristi YAML fajlove za definisanje servisa, mreža, volumena i drugih resursa potrebnih za pokretanje više Docker kontejnera kao jedne aplikacije.<\/p>\n<p>Podrazumevana putanja do compose fajla je <strong>root folder projekta<\/strong>, a preferirani naziv je <strong>compose.yaml<\/strong>. Zbog kompatibilnosti unazad, Docker Compose podržava i nazive compose.yml, docker-compose.yaml i docker-compose.yml.<\/p>\n<p>Pravila YAML sintakse koja treba znati:<\/p>\n<ul>\n<li>Struktura YAML fajla je niz parova <strong>ključ: vrednost<\/strong>, koji se odvajaju dvotačkom i razmakom. <strong>Razmak posle dvotačke je obavezan<\/strong>, kako bi i vrednosti koje sadrže dvotačku (npr. URL-ovi) bile moguće.<\/li>\n<li>Ključevi se ne pišu sa crticom – <strong>crtica (-) označava element liste<\/strong> vrednosti vezanih za ključ.<\/li>\n<li>Sve podvrednosti se <strong>uvlače razmacima<\/strong> u odnosu na roditeljski ključ.<\/li>\n<li><strong>Komentari<\/strong> se pišu pomoću znaka <strong>#<\/strong>.<\/li>\n<\/ul>\n<p>Glavni delovi compose fajla:<\/p>\n<ul>\n<li><strong>version<\/strong> – ranije se na početku fajla definisala verzija specifikacije; u poslednjoj verziji se ne koristi i ispisuje upozorenje u terminalu.<\/li>\n<li><strong>name<\/strong> – naziv projekta; ako nije eksplicitno definisan, Compose ga dodeljuje na osnovu naziva root foldera.<\/li>\n<li><strong>services<\/strong> – servisi koji se pokreću kao kontejneri (npr. mysql, backend, frontend). Svaki servis se definiše kao podsekcija i ima svoja podešavanja: sliku, volumene, environment varijable, mreže i druge opcije.<\/li>\n<li><strong>networks<\/strong> i <strong>volumes<\/strong> – na istom nivou kao services definišu se mreže i imenovani volumeni.<\/li>\n<\/ul>"}, {"id": "03-3", "t": "Primer: compose.yaml iz skripte (fav-app)", "h": "<pre><code>name: 'fav-app'\nservices:\n  mysql:\n    image: mysql:latest\n    container_name: mysql-server\n    env_file:\n      - ./env/mysql.env\n    networks:\n      - app-network\n    volumes:\n      - mysql-data:/var/lib/mysql\n      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql\n      - ./db/my.cnf:/etc/mysql/conf.d/my-custom.cnf:ro\n    healthcheck:\n      test: [\"CMD\", \"mysqladmin\", \"ping\", \"-h\", \"localhost\", \"-u\", \"novi\", \"--password=novi\"]\n      interval: 10s\n      timeout: 10s\n      retries: 6\n  backend:\n    build: ./backend\n    container_name: fav-backend\n    ports:\n      - 3000:3000\n    env_file:\n      - ./env/backend.env\n    networks:\n      - app-network\n    volumes:\n      - ./backend:/app\n      - /app/node_modules\n    depends_on:\n      mysql: #naziv servisa ne naziv kontejnera mysql-server\n        condition: service_healthy\n  frontend:\n    build: ./frontend\n    container_name: fav-frontend\n    ports:\n      - \"3001:3000\"\n    networks:\n      - app-network\n    volumes:\n      - ./frontend:/app\n      - /app/node_modules\n    depends_on:\n      - backend\nnetworks:\n  app-network:\n    driver: bridge\nvolumes:\n  mysql-data:<\/code><\/pre>"}, {"id": "03-4", "t": "Opcije servisa", "h": "<p><strong>image<\/strong> određuje koju Docker sliku treba koristiti (npr. zvaničnu mysql:latest sa Docker Hub-a). Vrednost može biti i naziv već kreirane lokalne slike.<\/p>\n<p><strong>build<\/strong> se koristi umesto image kada se slika pravi iz našeg Dockerfile-a – npr. <code>build: ./backend<\/code> koristi Dockerfile iz foldera backend. Može se pisati kao string sa putanjom ili sa podopcijama (<code>context<\/code>, <code>dockerfile<\/code>).<\/p>\n<p><strong>container_name<\/strong> definiše ime kontejnera (npr. mysql-server, fav-backend).<\/p>\n<p><strong>ports<\/strong> zamenjuje opciju <code>-p<\/code> i mapira port sa spoljnog interfejsa na port unutar kontejnera, npr. <code>- \"3001:3000\"<\/code>. Navodnici su samo mera opreza da se vrednost ne bi shvatila kao ključ: vrednost par.<\/p>\n<p><strong>environment<\/strong> definiše varijable okruženja – sve ono što se u terminalu zadavalo sa <code>-e<\/code>. Može se pisati kao ključ: vrednost parovi ili kao lista sa znakom jednakosti:<\/p>\n<pre><code>environment:\n  MYSQL_ROOT_PASSWORD: mypassword\n  MYSQL_DATABASE: swfavorites\n\nenvironment:\n  - MYSQL_ROOT_PASSWORD=mypassword\n  - MYSQL_DATABASE=swfavorites<\/code><\/pre>\n<p><strong>env_file<\/strong> učitava environment varijable iz posebne datoteke (npr. <code>./env/mysql.env<\/code>), pa se one ne pišu direktno u compose fajl. Na primer, backend.env sadrži <code>DB_HOST=mysql-server<\/code>, <code>DB_USER=novi<\/code>, <code>DB_PASSWORD=novi<\/code> i <code>DB_NAME=swfavorites<\/code>.<\/p>\n<p><strong>networks<\/strong> dodaje kontejner u mrežu, kako bi mogao da komunicira sa ostalim kontejnerima u njoj.<\/p>\n<p><strong>volumes<\/strong> definiše volumene servisa, i to kao listu.<\/p>\n<p><strong>depends_on<\/strong> definiše zavisnost servisa od drugog servisa – navedeni servis se pokreće pre servisa koji zavisi od njega.<\/p>\n<p><strong>healthcheck<\/strong> definiše proveru da li je pokrenut servis „zdrav“.<\/p>\n<p>Pored ovih postoje i opcije <strong>restart<\/strong> (npr. <code>restart: always<\/code> automatski restartuje servis ako se zaustavi), <strong>entrypoint<\/strong> (komanda ili skripta koja se izvršava pri pokretanju), <strong>command<\/strong> (npr. <code>command: [\"npm\", \"start\"]<\/code>), <strong>labels<\/strong> (dodatne oznake), <strong>network_mode<\/strong> (npr. <code>network_mode: host<\/code>) i <strong>detach<\/strong> (<code>detach: true<\/code> pokreće kontejner u pozadini).<\/p>"}, {"id": "03-5", "t": "Volumeni u compose fajlu", "h": "<p>U servisu mysql definisan je jedan <strong>imenovani volumen<\/strong> <code>mysql-data<\/code>, mapiran na <code>/var/lib/mysql<\/code> – mesto gde MySQL čuva svoje podatke. Da bi imenovani volumen radio, potrebna su <strong>dva koraka<\/strong>: volumen se definiše pod ključem <code>volumes<\/code> na istom nivou kao services, a zatim se referencira u servisu.<\/p>\n<p>Pored imenovanog, servis ima i dva <strong>bind-mount<\/strong> volumena. Prvi postavlja <code>init.sql<\/code> u <code>/docker-entrypoint-initdb.d/<\/code> – SQL fajl sa komandama koje su se ranije pokretale ručno u mysql terminalu (baza ga izvršava pri inicijalizaciji). Drugi postavlja konfiguracioni fajl <code>my.cnf<\/code>, a oznaka <code>:ro<\/code> znači da je montiran samo za čitanje (read-only).<\/p>\n<p>U servisima backend i frontend definisana su po dva volumena:<\/p>\n<ul>\n<li><strong>./backend:/app<\/strong> je bind-mount koji mapira lokalni folder backend na putanju /app u kontejneru. Ovo omogućava menjanje aplikacije na lokalnom računaru bez potrebe da se kreira nova slika da bi se videle promene.<\/li>\n<li><strong>/app/node_modules<\/strong> je neimenovani volumen. Definiše node_modules direktorijum unutar kontejnera bez eksplicitnog mapiranja, pa je node_modules dostupan samo unutar kontejnera.<\/li>\n<\/ul>"}, {"id": "03-6", "t": "Mreže u compose fajlu", "h": "<p>Navođenje mreža nije obavezno, jer Docker automatski kreira mrežu za kontejnere koji pripadaju istoj grupi servisa. Mreža se ipak može eksplicitno definisati kada želimo kontrolu nad njenim postavkama ili kada želimo da povežemo kontejnere iz različitih grupa servisa. Za to su takođe potrebna <strong>dva koraka<\/strong>: mreža se definiše pod ključem <code>networks<\/code> (ime i drajver, npr. <code>driver: bridge<\/code>), a zatim se servis dodaje u nju pod ključem <code>networks<\/code> u samom servisu.<\/p>"}, {"id": "03-7", "t": "depends_on i healthcheck", "h": "<p>Kada se backend pokrene sa običnim <code>depends_on: - mysql<\/code>, compose prvo pokreće mysql-server, pa fav-backend – ali backend ipak prijavljuje grešku jer konekcija na bazu nije uspela. Razlog je to što mysql-server kontejner posle kreiranja izvršava još nekoliko komandi i <strong>nije bio potpuno spreman za povezivanje<\/strong>, iako je depends_on definisan.<\/p>\n<p>Rešenje je <strong>healthcheck<\/strong> u servisu mysql, koji proverava da li je mysql servis „živ“, i izmena depends_on opcije tako da backend čeka da provera prođe:<\/p>\n<pre><code>depends_on:\n  mysql:\n    condition: service_healthy<\/code><\/pre>\n<p>Kada se depends_on navodi kao lista, podrazumevani uslov je da je servis pokrenut (<strong>service_started<\/strong>), pa se on ni ne navodi. Kada je potrebno da servis bude „zdrav“, eksplicitno se navodi naziv servisa i uslov <strong>service_healthy<\/strong>.<\/p>\n<p>Podopcije healthcheck-a:<\/p>\n<ul>\n<li><strong>test<\/strong> je obavezna podopcija – ona zapravo proverava da li je servis dostupan. Može se definisati kao niz komandi, gde prvi element mora biti <strong>NONE, CMD ili CMD-SHELL<\/strong>, ili kao string u obliku CMD-SHELL komande.<\/li>\n<li><strong>interval<\/strong> – vreme nakon pokretanja kontejnera kada će se provera pokrenuti.<\/li>\n<li><strong>timeout<\/strong> – ako provera traje duže od zadatog vremena, smatra se neuspešnom.<\/li>\n<li><strong>retries<\/strong> – ako servis ne prođe proveru zadati broj puta, kontejner se smatra <strong>unhealthy<\/strong>.<\/li>\n<\/ul>\n<p>Za MySQL se koristi <code>mysqladmin ping<\/code>, a za PostgreSQL (primer sa vežbi) <code>pg_isready<\/code>, npr. <code>test: [\"CMD-SHELL\", \"pg_isready -U student -d games\"]<\/code>.<\/p>"}, {"id": "03-8", "t": "Pokretanje compose fajla", "h": "<div class='tw'><table><thead><tr><th>Komanda<\/th><th>Šta radi<\/th><\/tr><\/thead><tbody><tr><td><code>docker compose up<\/code><\/td><td>Kreira mreže i volumene, gradi slike i pokreće sve servise<\/td><\/tr><tr><td><code>docker compose up -d --build<\/code><\/td><td>Gradi slike i pokreće servise u pozadini<\/td><\/tr><tr><td>CTRL + C u terminalu sa <code>up<\/code><\/td><td>Stopira sve kontejnere pokrenute tom komandom<\/td><\/tr><tr><td><code>docker compose down<\/code><\/td><td>Stopira i briše sve pokrenute kontejnere i definisane mreže<\/td><\/tr><tr><td><code>docker compose down -v<\/code><\/td><td>Briše i imenovane volumene<\/td><\/tr><tr><td><code>docker compose ps<\/code><\/td><td>Prikazuje servise i njihov status<\/td><\/tr><tr><td><code>docker compose logs -f<\/code><\/td><td>Prati logove<\/td><\/tr><tr><td><code>docker compose exec backend sh<\/code><\/td><td>Otvara shell unutar kontejnera servisa<\/td><\/tr><\/tbody><\/table><\/div>\n<div class='call note'><b>Napomena<\/b>Komanda <code>docker compose down<\/code> <strong>ne briše volumene ni slike<\/strong>. Slike će se svakako ponovo build-ovati pri sledećem <code>docker compose up<\/code>, ali se imenovani volumeni neće „resetovati“ – ako su potrebni novi, prethodne treba obrisati ručno.<\/div>"}]}, {"id": "04", "t": "Linux okruženje: WSL 2 i Docker Engine", "l": [{"id": "04-1", "t": "Zašto Linux okruženje", "h": "<p>Docker je izgrađen na osnovu <strong>Linux kontejnera<\/strong> – kontejneri dele kernel host operativnog sistema, pa je Linux njegovo prirodno okruženje. Na vežbama se Docker zato koristi iz Linux terminala, a na Windows računarima Linux se dobija preko <strong>WSL 2<\/strong>.<\/p>"}, {"id": "04-2", "t": "Šta je WSL", "h": "<p><strong>WSL (Windows Subsystem for Linux)<\/strong> omogućava pokretanje Linux distribucije, npr. <strong>Ubuntu<\/strong>, direktno na Windows-u. Cilj na vežbama je da se Ubuntu instalira preko <strong>WSL 2<\/strong>, a da se u njemu pokreću <strong>Docker Engine i Docker Compose<\/strong> – bez obaveznog Docker Desktop-a.<\/p>\n<p>Razlika koju treba znati: <strong>Docker Desktop<\/strong> je grafička aplikacija za Windows i Mac, dok je <strong>Docker Engine<\/strong> Docker servis (daemon) i CLI koji se instaliraju direktno unutar Linux distribucije.<\/p>\n<p>WSL se instalira komandom <code>wsl --install<\/code> u PowerShell-u pokrenutom kao administrator. Komanda <code>wsl --list --verbose<\/code> prikazuje instalirane distribucije – pored Ubuntu-a treba da piše <strong>VERSION 2<\/strong>, a ako piše 1, distribucija se prebacuje komandom <code>wsl --set-version Ubuntu 2<\/code>. Komanda <code>wsl --shutdown<\/code> gasi WSL.<\/p>\n<div class='call warn'><b>Zamka<\/b>Komande koje se kucaju u <strong>Windows PowerShell-u<\/strong> (npr. <code>wsl ...<\/code>) i komande koje se kucaju u <strong>Ubuntu terminalu<\/strong> (npr. <code>sudo apt ...<\/code>, <code>docker ...<\/code>) ne treba mešati.<\/div>"}, {"id": "04-3", "t": "Osnovni pojmovi rada u Linux terminalu", "h": "<ul>\n<li><strong>sudo<\/strong> izvršava komandu sa administratorskim pravima – zato se Docker komande u materijalima često pišu kao <code>sudo docker ...<\/code>.<\/li>\n<li><strong>apt<\/strong> je menadžer paketa u Ubuntu-u: <code>sudo apt update<\/code> osvežava listu paketa, a <code>sudo apt install &lt;paket&gt;<\/code> instalira paket.<\/li>\n<li><strong>systemd<\/strong> upravlja servisima u Linux-u, kao što je Docker daemon. Servisima se upravlja komandom <strong>systemctl<\/strong>, npr. <code>sudo systemctl status docker<\/code> prikazuje status Docker servisa, a <code>sudo systemctl enable --now docker<\/code> ga uključuje i odmah pokreće.<\/li>\n<li>Docker komande se mogu koristiti i bez sudo ako se korisnik doda u <strong>docker grupu<\/strong> (<code>sudo usermod -aG docker \"$USER\"<\/code>). Članstvo u ovoj grupi daje privilegije ekvivalentne administratorskim.<\/li>\n<li>Projekte je preporučljivo čuvati u Linux direktorijumu (npr. <code>~/projekti<\/code>), a ne na Windows disku (<code>/mnt/c<\/code>), zbog boljih performansi rada sa mnogo fajlova i bind mount-ovima.<\/li>\n<li>Komanda <code>code .<\/code> otvara trenutni folder u VS Code-u (uz WSL ekstenziju).<\/li>\n<\/ul>"}]}, {"id": "05", "t": "Next.js – uvod i tehnologije (poglavlje 1)", "l": [{"id": "05-1", "t": "Uvod", "h": "<p>Uz rast JavaScript ekosistema, <strong>Next.js se nametnuo kao vodeći full-stack framework koji nadograđuje React<\/strong> i pojednostavljuje izgradnju modernih veb aplikacija.<\/p>\n<p>Kao primer kroz celu skriptu pravi se veb aplikacija koja studentima olakšava učenje definicija i pojmova pomoću <strong>flash kartica<\/strong>. „Flash“ kartica je mala kartonska (ili digitalna) kartica koja sa jedne strane sadrži pitanje, pojam ili zadatak, a sa druge strane tačan odgovor, definiciju ili rešenje. Učenje teče tako što pogledamo prednju stranu, pokušamo da se aktivno prisetimo odgovora, okrenemo karticu i proverimo tačnost, a zatim je razvrstamo u gomilu „znam / ne znam“. Skripta prolazi kroz sve korake pravljenja <strong>CRUD full stack aplikacije<\/strong>, bez komplikovane poslovne logike.<\/p>"}, {"id": "05-2", "t": "Pravljenje i pokretanje projekta", "h": "<p>Za pravljenje projekta potrebno je da su instalirani <strong>Node.js<\/strong> i <strong>Docker<\/strong>. Projekat se pravi komandom:<\/p>\n<pre><code>npx create-next-app@latest flashcards-webapp --app --typescript --tailwind --src-dir<\/code><\/pre>\n<p><strong>create-next-app<\/strong> generiše potpun „boilerplate“ sa konfigurisanom TypeScript podrškom i Tailwind-om, pa odmah imamo čist razvojni setup bez ručne konfiguracije. Parametri imaju sledeće funkcije:<\/p>\n<ul>\n<li><strong>--app<\/strong> – koristimo <strong>app router<\/strong>. Next.js ima dva rutera, <strong>app<\/strong> i <strong>pages<\/strong>; pages je <strong>legacy<\/strong>, tj. više se ne koristi. App router bi bio korišćen i automatski, ali se parametar navodi da nas komanda ne bi pitala.<\/li>\n<li><strong>--typescript<\/strong> – komanda podešava TypeScript kompajliranje. Next.js je originalno JavaScript framework, pa se može napraviti i JavaScript projekat.<\/li>\n<li><strong>--tailwind<\/strong> – koristimo Tailwind stilizovanje umesto samo CSS-a.<\/li>\n<li><strong>--src-dir<\/strong> – pravi se <strong>src<\/strong> folder u kom se nalazi samo kod; u suprotnom bi kod bio skladišten zajedno sa pratećim fajlovima (public, package.json, tsconfig.json...). Ovakvo grupisanje nije standardizovano ni obavezno.<\/li>\n<\/ul>\n<p>Fajl <strong>package.json<\/strong> predstavlja sve pakete, tj. module koje smo instalirali, sadrži osnovne informacije o projektu i <strong>skripte<\/strong> koje se mogu pokrenuti nad projektom. Folder <strong>public<\/strong> sadrži statične fajlove koje Next.js servira.<\/p>\n<p>Pri pravljenju projekta pominju se još tri pojma:<\/p>\n<ul>\n<li><strong>ESLint<\/strong> je alat koji automatski proverava i upozorava na greške u JavaScript/TypeScript kodu i pomaže da kod bude konzistentan i kvalitetan.<\/li>\n<li><strong>Turbopack<\/strong> je novi, brži <strong>bundler<\/strong> za Next.js koji ubrzava lokalni razvoj i reloading u odnosu na <strong>Webpack<\/strong>, koji je Next.js do skoro koristio.<\/li>\n<li><strong>Import alias<\/strong> omogućava da koristimo kratke putanje poput <code>@/components/Button<\/code> umesto relativnih <code>../../../components/Button<\/code>, radi lakše organizacije i čitljivosti koda.<\/li>\n<\/ul>\n<p>Projekat se pokreće komandom <strong>npm run dev<\/strong>. Ispisuju se port na kom je proces pokrenut i verzija Next.js-a, a aplikacija je dostupna na <strong>http://localhost:3000<\/strong>.<\/p>\n<div class='tw'><table><thead><tr><th>npm skripta<\/th><th>Šta pokreće<\/th><\/tr><\/thead><tbody><tr><td><code>npm run dev<\/code><\/td><td><code>next dev<\/code> – razvojni server<\/td><\/tr><tr><td><code>npm run build<\/code><\/td><td><code>next build<\/code> – produkcioni build<\/td><\/tr><tr><td><code>npm start<\/code><\/td><td><code>next start<\/code> – pokretanje produkcionog build-a<\/td><\/tr><\/tbody><\/table><\/div>"}, {"id": "05-3", "t": "Rutiranje u Next.js-u", "h": "<p>U <strong>src<\/strong> folderu se nalazi <strong>app<\/strong> folder. Next.js koristi <strong>file-based routing<\/strong> za rutiranje na vebu, a osnovni koncepti su:<\/p>\n<ul>\n<li><strong>page.tsx<\/strong> predstavlja stranicu koja se prikazuje kada korisnik uđe na tu rutu.<\/li>\n<li><strong>layout.tsx<\/strong> predstavlja zajednički UI koji se koristi na više stranica. On se nasleđuje na sve stranice na istom nivou i na nivoima ispod, a nivoi se definišu folderima. Layout-i se po defaultu <strong>ne re-renderuju<\/strong> pri promeni rute.<\/li>\n<li><strong>Folder<\/strong> nam dozvoljava da se spustimo jedan nivo dublje – na primer, ako napravimo folder <strong>about<\/strong> i u njega stavimo page.tsx sa pravilno eksportovanom funkcijom, na ruti <strong>/about<\/strong> videćemo sadržaj te stranice.<\/li>\n<\/ul>\n<p>U demonstraciji iz skripte layout pravi dve crvene sekcije, „POCETAK“ i „KRAJ“, a između njih stoji promenljiva <strong>children<\/strong> – „deca“, tj. komponente koje se nalaze na istom nivou ili ispod layout-a. Stranica na vrhu app foldera predstavlja <strong>root rutu<\/strong> i vraća plavi div sa tekstom „GLAVNA STRANICA“. Na času je urađen isti primer, uz dodatni folder <strong>strana2<\/strong> sa svojim layout-om i stranicom:<\/p>\n<pre><code>// src/app/layout.tsx (deo)\n&lt;body className={`${geistSans.variable} ${geistMono.variable} antialiased`}&gt;\n  &lt;p className=\"bg-red-500 text-white font-bold\"&gt;Ovo je pocetak Layout fajla&lt;/p&gt;\n  {children}\n  &lt;p className=\"bg-red-500 text-white font-bold\"&gt;Ovo je kraj Layout fajla&lt;/p&gt;\n&lt;/body&gt;\n\n// src/app/strana2/page.tsx  -&gt;  ruta /strana2\nexport default function Page2() {\n  return &lt;p&gt;Ovo je strana 2, fajl page.tsx&lt;/p&gt;\n}<\/code><\/pre>\n<p>Na ruti /strana2 vidi se kako se layout-i ugnježdavaju: root layout je spolja, layout strane 2 unutra, a sadržaj strane 2 u sredini.<\/p>"}, {"id": "05-4", "t": "React", "h": "<p><strong>React je JavaScript biblioteka koja omogućava jednostavno kreiranje interaktivnih korisničkih interfejsa.<\/strong> Omogućava nam da razdvojimo aplikaciju na manje, višekratne komponente koje reaguju na promene podataka bez potrebe za osvežavanjem cele stranice. Da bi komponente mogle da rade sa podacima i reaguju na promene, React uvodi poseban mehanizam koji se zove <strong>hook-ovi<\/strong>. U skripti se obrađuju dva osnovna hook-a – <strong>useState<\/strong> i <strong>useEffect<\/strong>.<\/p>\n<p><strong>useState<\/strong> nam dozvoljava da skladištimo podatke u varijabli i postavljamo tu varijablu. Razlika između obične varijable i hook-a je to što, kada se hook promeni, on automatski započinje <strong>re-render<\/strong> komponente i svih komponenti koje ona renderuje.<\/p>\n<pre><code>const [count, setCount] = useState(0);<\/code><\/pre>\n<p><strong>useEffect<\/strong> pokreće određenu logiku <strong>nakon rendera<\/strong>. Ako ima <strong>dependency niz<\/strong>, poziva se nakon prvog rendera i svaki put kada se vrednosti u nizu promene. Pored toga, useEffect može da vrati <strong>cleanup funkciju<\/strong> koja služi za čišćenje efekata kada se komponenta unmount-uje ili pre nego što se efekat ponovo pokrene.<\/p>\n<p>Primer iz skripte: dugme povećava brojač, a useEffect posmatra <code>count<\/code> i, kada brojač pređe 20, prikazuje poruku.<\/p>\n<pre><code>\"use client\";\nimport { useEffect, useState } from \"react\";\n\nexport default function Home() {\n  const [count, setCount] = useState(0);\n  const [counterOver20, setCounterOver20] = useState(false);\n\n  useEffect(() =&gt; {\n    setCounterOver20(count &gt; 20);\n  }, [count]);\n\n  return (\n    &lt;div className=\"bg-blue-400 text-white\"&gt;\n      &lt;p className={\"text-[32px]\"}&gt;Brojač: {count}&lt;/p&gt;\n      &lt;button className={\"bg-yellow-400\"} onClick={() =&gt; setCount(prev =&gt; prev + 1)}&gt;\n        Povecaj brojac\n      &lt;/button&gt;\n      {counterOver20 &amp;&amp; &lt;p className={\"text-[32px]\"}&gt;Brojač je prešao 20!&lt;/p&gt;}\n    &lt;/div&gt;\n  );\n}<\/code><\/pre>\n<h3>Za
