const LS = "iteh_p1_v1";
let st = {done:{}, last:null, wrong:{}};
try { const s = JSON.parse(localStorage.getItem(LS)); if (s) st = Object.assign(st, s); } catch(e) {}
function save(){ try { localStorage.setItem(LS, JSON.stringify(st)); } catch(e) {} }

const lessons = []; DATA.chapters.forEach(c => c.l.forEach(l => { l.ch = c; lessons.push(l); }));
const byLesson = {}; DATA.q.forEach(q => (byLesson[q.l] = byLesson[q.l] || []).push(q));
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = s => esc(s).replace(/``\s?(.+?)\s?``|`([^`]+)`/g, (m,a,b) => "<code>"+(a||b)+"</code>");
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const norm = s => String(s).toLowerCase().trim().replace(/^[`'"„“”]+|[`'"„“”.;]+$/g,"").replace(/\s+/g," ");
const $ = s => document.querySelector(s);
const view = $("#view"), side = $("#side");
let tab = "learn";

function updateProg(){
  const learnable = lessons.filter(l => byLesson[l.id]);
  const d = learnable.filter(l => st.done[l.id]).length;
  $("#progTxt").textContent = `Lekcije ${d}/${learnable.length}`;
  $("#progBar").style.width = (100*d/learnable.length) + "%";
}

/* ---------- pitanje (zajedničko za lekcije i kviz) ---------- */
function renderQ(q, num, onDone){
  const box = document.createElement("div"); box.className = "q";
  box.innerHTML = `<div class="qt"><span class="n">${num}.</span>${fmt(q.q)}</div>`;
  const fb = document.createElement("div");
  const finish = (ok, shown) => {
    fb.className = "fb " + (ok ? "ok" : "no");
    fb.innerHTML = `<b>${ok ? "Tačno!" : "Netačno."}</b>${shown ? "Tačan odgovor: <code>"+esc(shown)+"</code><br>" : ""}${fmt(q.e || "")}`;
    box.appendChild(fb);
    if (ok) delete st.wrong[q.id]; else st.wrong[q.id] = 1;
    save(); onDone && onDone(ok);
  };
  if (q.t === "mc" || q.t === "tf") {
    const opts = q.t === "tf" ? [["Tačno", q.v === true], ["Netačno", q.v === false]] : shuffle(q.o.map((o,i) => [o, i === 0]));
    const wrap = document.createElement("div"); wrap.className = "opts";
    opts.forEach(([txt, right], i) => {
      const b = document.createElement("button"); b.className = "opt";
      b.innerHTML = `<span class="k">${"ABCD"[i] || i+1}</span><span>${fmt(txt)}</span>`;
      b.dataset.right = right ? 1 : 0;
      b.onclick = () => {
        wrap.querySelectorAll(".opt").forEach(x => { x.disabled = true; if (x.dataset.right === "1") x.classList.add("right"); });
        if (!right) b.classList.add("wrong");
        finish(right);
      };
      wrap.appendChild(b);
    });
    box.appendChild(wrap);
  } else {
    const row = document.createElement("div"); row.className = "fillrow";
    row.innerHTML = `<input type="text" placeholder="Upiši odgovor…" autocomplete="off" spellcheck="false"><button class="btn small">Proveri</button>`;
    const inp = row.querySelector("input"), btn = row.querySelector("button");
    const check = () => {
      if (!inp.value.trim()) return;
      const ok = q.a.some(a => norm(a) === norm(inp.value));
      inp.disabled = btn.disabled = true; inp.classList.add(ok ? "right" : "wrong");
      finish(ok, ok ? "" : q.a[0]);
    };
    btn.onclick = check; inp.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); e.stopPropagation(); check(); } };
    box.appendChild(row);
  }
  return box;
}

/* ---------- lekcije ---------- */
function renderSide(){
  if (tab === "cheat") { side.innerHTML = `<h4>Cheat sheet</h4>` + [...view.querySelectorAll(".cheat h2")].map((h,i)=>`<a data-h="${i}"><span>${h.textContent}</span></a>`).join("");
    side.querySelectorAll("a").forEach(a => a.onclick = () => { view.querySelectorAll(".cheat h2")[a.dataset.h].scrollIntoView({behavior:"smooth"}); side.classList.remove("open"); }); return; }
  let h = "";
  DATA.chapters.forEach(c => {
    h += `<h4>${esc(c.t)}</h4>`;
    c.l.forEach(l => {
      const has = !!byLesson[l.id];
      const done = st.done[l.id];
      const on = tab === "learn" && st.last === l.id;
      h += `<a data-id="${l.id}" class="${on ? "on" : ""}"><span class="dot ${done ? "done" : ""}">${done ? "✓" : ""}</span><span>${esc(l.t)}${has ? "" : ""}</span></a>`;
    });
  });
  side.innerHTML = h;
  side.querySelectorAll("a").forEach(a => a.onclick = () => { setTab("learn"); openLesson(a.dataset.id); side.classList.remove("open"); });
  const act = side.querySelector("a.on"); if (act) act.scrollIntoView({block:"nearest"});
}

function openLesson(id){
  const idx = Math.max(0, lessons.findIndex(l => l.id === id));
  const l = lessons[idx]; st.last = l.id; save();
  const qs = shuffle(byLesson[l.id] || []).slice(0, 8);
  const total = (byLesson[l.id] || []).length;
  view.innerHTML = `<div class="crumb">${esc(l.ch.t)}</div><h1>${esc(l.t)}</h1><div class="lesson">${l.h}</div>`;
  const card = document.createElement("div"); card.className = "card";
  if (qs.length) {
    card.innerHTML = `<h2>Proveri znanje</h2><div class="sub">${qs.length} ${qs.length === 1 ? "pitanje" : "pitanja"} iz ove lekcije${total > qs.length ? ` (nasumično od ukupno ${total} – „Nova pitanja“ daje drugi izbor)` : ""}. Odgovori na sva da bi lekcija bila označena kao završena.</div>`;
    let answered = 0, correct = 0;
    const sc = document.createElement("div"); sc.className = "score";
    shuffle(qs).forEach((q, i) => card.appendChild(renderQ(q, i+1, ok => {
      answered++; if (ok) correct++;
      sc.textContent = `Rezultat: ${correct}/${answered}` + (answered === qs.length ? (correct === qs.length ? " — sve tačno, lekcija završena!" : " — lekcija završena. Možeš je ponoviti da utvrdiš gradivo.") : "");
      if (answered === qs.length) { st.done[l.id] = 1; save(); updateProg(); renderSide(); }
    })));
    const again = document.createElement("button"); again.className = "btn ghost small"; again.textContent = total > qs.length ? "Nova pitanja" : "Ponovi pitanja";
    again.onclick = () => openLesson(l.id);
    const r = document.createElement("div"); r.className = "navrow"; r.append(sc, again); card.appendChild(r);
  } else {
    card.innerHTML = `<h2>Pročitano?</h2><div class="sub">Ova lekcija nema posebna pitanja – služi kao kontekst za ostatak gradiva.</div>`;
  }
  view.appendChild(card);
  const nav = document.createElement("div"); nav.className = "navrow";
  const prev = lessons[idx-1], next = lessons[idx+1];
  nav.innerHTML = `<div>${prev ? `<button class="btn ghost" id="pv">← ${esc(prev.t)}</button>` : ""}</div><div>${next ? `<button class="btn" id="nx">${esc(next.t)} →</button>` : `<button class="btn" id="toQuiz">Na veliki kviz →</button>`}</div>`;
  view.appendChild(nav);
  if (prev) $("#pv").onclick = () => openLesson(prev.id);
  if (next) $("#nx").onclick = () => openLesson(next.id);
  const tq = $("#toQuiz"); if (tq) tq.onclick = () => setTab("quiz");
  renderSide(); window.scrollTo(0,0);
}

/* ---------- veliki kviz ---------- */
let qz = null;
let cfg = { ch: new Set(DATA.chapters.filter(c => c.l.some(l => byLesson[l.id])).map(c => c.id)), n: 20, mode: "sve" };
function quizSetup(){
  const chs = DATA.chapters.filter(c => c.l.some(l => byLesson[l.id]));
  const pool = () => DATA.q.filter(q => cfg.ch.has(q.l.slice(0,2)) && (cfg.mode !== "greske" || st.wrong[q.id]));
  const draw = () => {
    const p = pool().length, w = Object.keys(st.wrong).length;
    view.innerHTML = `<h1>Veliki kviz</h1>
    <p class="muted">Ukupno ${DATA.q.length} pitanja iz celog gradiva za P1 – zaokruživanje, tačno/netačno i dopisivanje reči ili koda. Izaberi oblasti i broj pitanja; pitanja i ponuđeni odgovori se svaki put mešaju.</p>
    <div class="card">
      <div class="lbl">Oblasti</div>
      <div class="chips" id="chs">${chs.map(c => `<button class="chip ${cfg.ch.has(c.id) ? "on" : ""}" data-c="${c.id}">${esc(c.t.replace(/\s*\(.*\)/,""))}</button>`).join("")}</div>
      <div class="lbl">Pitanja</div>
      <div class="chips" id="mode">
        <button class="chip ${cfg.mode==="sve"?"on":""}" data-m="sve">Sva pitanja</button>
        <button class="chip ${cfg.mode==="greske"?"on":""}" data-m="greske">Samo ona koja sam pogrešio (${w})</button>
      </div>
      <div class="lbl">Broj pitanja</div>
      <div class="chips" id="num">${[10,20,40,80,0].map(n => `<button class="chip ${cfg.n===n?"on":""}" data-n="${n}">${n||"Sva"}</button>`).join("")}</div>
      <div class="navrow"><span class="score">U izboru: ${p} pitanja</span><button class="btn" id="go" ${p ? "" : "disabled"}>Započni kviz</button></div>
    </div>
    <p class="muted" style="font-size:14px">Prečice: <kbd>A</kbd>–<kbd>D</kbd> biraju odgovor, <kbd>Enter</kbd> prelazi na sledeće pitanje.</p>`;
    view.querySelectorAll("#chs .chip").forEach(b => b.onclick = () => { const c = b.dataset.c; cfg.ch.has(c) ? cfg.ch.delete(c) : cfg.ch.add(c); draw(); });
    view.querySelectorAll("#mode .chip").forEach(b => b.onclick = () => { cfg.mode = b.dataset.m; draw(); });
    view.querySelectorAll("#num .chip").forEach(b => b.onclick = () => { cfg.n = +b.dataset.n; draw(); });
    $("#go").onclick = () => { let list = shuffle(pool()); if (cfg.n) list = list.slice(0, cfg.n); startQuiz(list); };
  };
  draw();
}
function startQuiz(list){ qz = { list, i: 0, ok: 0, res: [] }; quizStep(); }
function quizStep(){
  const { list, i } = qz;
  if (i >= list.length) return quizEnd();
  const q = list[i], l = lessons.find(x => x.id === q.l);
  view.innerHTML = `<div class="qhead"><span>Pitanje ${i+1} / ${list.length}<span class="tag">${esc(l.ch.t.replace(/\s*\(.*\)/,""))}</span></span><span>Tačno: ${qz.ok}</span></div><div class="qprog"><i style="width:${100*i/list.length}%"></i></div>`;
  const card = document.createElement("div"); card.className = "card";
  let answered = false;
  card.appendChild(renderQ(q, i+1, ok => {
    answered = true; if (ok) qz.ok++; qz.res.push({ q, ok });
    const r = document.createElement("div"); r.className = "navrow";
    r.innerHTML = `<span class="score">Lekcija: ${esc(l.t)}</span><button class="btn" id="nq">${i+1 < list.length ? "Sledeće pitanje →" : "Rezultat →"}</button>`;
    card.appendChild(r); $("#nq").onclick = () => { qz.i++; quizStep(); }; $("#nq").focus();
  }));
  view.appendChild(card);
  const stop = document.createElement("div"); stop.className = "navrow";
  stop.innerHTML = `<button class="btn ghost small" id="qq">Prekini kviz</button>`; view.appendChild(stop);
  $("#qq").onclick = () => quizEnd();
  const inp = card.querySelector("input"); if (inp) inp.focus();
  window.scrollTo(0,0);
}
function quizEnd(){
  const n = qz.res.length, ok = qz.res.filter(r => r.ok).length, pct = n ? Math.round(100*ok/n) : 0;
  const wrong = qz.res.filter(r => !r.ok);
  const msg = pct >= 90 ? "Odlično – spreman si!" : pct >= 70 ? "Dobro je – ponovi oblasti gde si grešio." : pct >= 50 ? "Solidno, ali vrati se na lekcije iz kojih si grešio." : "Vrati se na lekcije i pokušaj ponovo.";
  view.innerHTML = `<h1>Rezultat</h1><div class="card"><div class="big">${pct}%</div><p>${ok} tačnih od ${n} odgovorenih. ${msg}</p>
    <div class="navrow"><button class="btn ghost" id="setup">Novi kviz</button>${wrong.length ? `<button class="btn" id="redo">Ponovi pogrešna (${wrong.length})</button>` : ""}</div></div>
    ${wrong.length ? `<div class="card review"><h2>Pitanja na koja si pogrešio</h2>${wrong.map((r,k) => {
      const q = r.q, ans = q.t === "mc" ? q.o[0] : q.t === "tf" ? (q.v ? "Tačno" : "Netačno") : q.a[0];
      const l = lessons.find(x => x.id === q.l);
      return `<div class="q"><div class="qt"><span class="n">${k+1}.</span>${fmt(q.q)}</div><div class="fb ok"><b>${fmt(ans)}</b>${fmt(q.e||"")}<br><a href="#" data-l="${q.l}" style="color:var(--accent)">Otvori lekciju: ${esc(l.t)}</a></div></div>`; }).join("")}</div>` : ""}`;
  $("#setup").onclick = quizSetup;
  const rd = $("#redo"); if (rd) rd.onclick = () => startQuiz(shuffle(wrong.map(r => r.q)));
  view.querySelectorAll("a[data-l]").forEach(a => a.onclick = e => { e.preventDefault(); setTab("learn"); openLesson(a.dataset.l); });
  window.scrollTo(0,0);
}

/* ---------- cheat sheet ---------- */
function showCheat(){ view.innerHTML = `<h1>${esc(DATA.cheat.t)}</h1><div class="lesson cheat">${DATA.cheat.h}</div>`; renderSide(); window.scrollTo(0,0); }

function setTab(t){
  tab = t; document.querySelectorAll("nav.tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === t));
  if (t === "learn") openLesson(st.last || lessons[0].id);
  else if (t === "quiz") { quizSetup(); renderSide(); }
  else showCheat();
}
document.querySelectorAll("nav.tabs button").forEach(b => b.onclick = () => setTab(b.dataset.tab));
$("#menuBtn").onclick = () => side.classList.toggle("open");
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  const k = e.key.toUpperCase();
  if ("ABCD".includes(k) && k.length === 1) {
    const opts = [...view.querySelectorAll(".q:last-of-type .opt:not(:disabled)")];
    const b = opts["ABCD".indexOf(k)]; if (tab === "quiz" && b) b.click();
  } else if (e.key === "Enter" && tab === "quiz") { const n = $("#nq"); if (n) n.click(); }
});
updateProg(); setTab("learn");
</script>
</body>
